<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arena Game Coding</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Game Coding">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Lexend";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Russo One";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/russo-one-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
:root{--bg:#0a0f24;--panel:#121a3a;--panel2:#1a2550;--line:rgba(255,255,255,.1);--ink:#eaf0ff;--mut:#9aa8d4;--gold:#ffc83d;--blue:#3d8bff;--red:#ff3b5c;--green:#44e08a;--accent:#ffc83d;--r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Lexend,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.tabscr{padding-bottom:calc(62px + var(--safe-b))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:12px}
.hi{font:400 22px/1.15 "Russo One",system-ui,sans-serif;letter-spacing:.2px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.starsum{font:400 18px "Russo One",sans-serif;color:var(--gold);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;white-space:nowrap}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#0d1330;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
#nav[hidden]{display:none}
#nav button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--mut)}
#nav button i{font-style:normal;font-size:20px}
#nav button.on{color:var(--gold)}
/* peta misi */
.rank{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:var(--r);padding:12px 12px 14px;margin:0 0 12px}
.rank.lock{opacity:.55}
.rank h3{margin:0;font:400 18px "Russo One",sans-serif;color:var(--rc);display:flex;align-items:center;gap:8px}
.rank .tag{font:600 10px Lexend;letter-spacing:.8px;background:rgba(255,255,255,.1);color:var(--ink);padding:2px 7px;border-radius:99px}
.rank p{margin:2px 0 10px;color:var(--mut);font-size:13px}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.node{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;position:relative}
.node:active{transform:scale(.98)}
.node.locked{opacity:.45}
.node .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 15px "Russo One",system-ui,sans-serif;background:var(--rc);color:#0a0f24}
.node.done .n{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.node b{display:block;font-size:13px;line-height:1.2;font-weight:600}
.node .st{font-size:13px;color:var(--gold);letter-spacing:1px;margin-top:2px}
.node .st s{text-decoration:none;color:rgba(255,255,255,.2)}
/* bar atas ruang main */
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:52px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--panel);border:1px solid var(--line);flex:none}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font:400 17px/1.15 "Russo One",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena{position:relative;margin:0;background:#0d1530;border-block:1px solid var(--line)}
#cv{display:block;width:100%;aspect-ratio:360/200;height:auto}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.hud span{background:rgba(6,9,26,.72);padding:2px 8px;border-radius:99px;font:600 12px Lexend;border:1px solid rgba(255,255,255,.12)}
.pb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1330;border-bottom:1px solid var(--line)}
.pbb{width:44px;height:40px;border-radius:10px;background:var(--panel2);font-size:18px}
.pbb.spd{font:400 15px "Russo One",system-ui,sans-serif}
#pbRange{flex:1;min-width:0;height:40px;accent-color:var(--gold)}
.tabs{display:flex;padding:6px 10px 0;gap:6px}
.tabs button{flex:1;min-height:40px;border-radius:10px 10px 0 0;color:var(--mut);background:var(--panel);font-weight:600;font-size:14px}
.tabs button.on{background:var(--panel2);color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.panes{flex:1;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.pane{flex:1;overflow-y:auto;padding:10px 12px 90px;-webkit-overflow-scrolling:touch}
.runbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(10,15,36,0),#0a0f24 30%);z-index:4}
.primary{flex:1;min-height:50px;border-radius:14px;background:linear-gradient(180deg,#ffd75a,#f0a500);color:#1a1200;font:400 17px "Russo One",sans-serif;box-shadow:0 4px 0 #9a6a00}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6a00}
.primary.wide{width:100%;margin-top:14px}
.ghost{min-height:50px;min-width:50px;padding:0 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px}
/* info */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 4px;font:600 12px Lexend;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.card p{margin:0}
.goal{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.goal i{font-style:normal;flex:none;width:22px}
.goal.ok{color:var(--green)}
.logl{font:13px/1.5 "JetBrains Mono",monospace;padding:3px 0;border-bottom:1px dashed var(--line)}
.logl.good{color:var(--green)}.logl.bad{color:#ff8a9a}.logl.say{color:var(--gold)}
/* blok */
.root{border:2px dashed rgba(255,255,255,.2);border-radius:14px;padding:8px}
.root>.hd,.blk>.hd{font:400 13px "Russo One",system-ui,sans-serif;letter-spacing:.4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px}
.blk{border-radius:12px;margin:6px 0;padding:6px 8px;position:relative;border:2px solid transparent}
.blk.sel{border-color:#fff}
.blk.act{background:#2c6df0;font-weight:600;display:flex;align-items:center;gap:8px;min-height:44px}
.blk.act.skill{background:#8a4cf0}.blk.act.heal{background:#17a864}.blk.act.retreat{background:#d0553d}.blk.act.wait{background:#58648c}.blk.act.buy{background:#c68a00}
.blk.rep{background:#1c8f86}.blk.if{background:#b25a1a}.blk.elif{background:#a14b6e}.blk.else{background:#7a4a9e}
.blk .in{background:rgba(0,0,0,.22);border-radius:10px;padding:2px 6px 6px;margin:2px 0 4px;min-height:30px}
.add{width:100%;min-height:44px;border:2px dashed rgba(255,255,255,.35);border-radius:10px;color:#fff;font-weight:600;margin-top:4px;background:rgba(255,255,255,.06)}
.chipb{background:rgba(0,0,0,.35);border-radius:10px;min-height:36px;padding:0 10px;font:600 14px Lexend;border:1px solid rgba(255,255,255,.3)}
.step{display:inline-flex;align-items:center;background:rgba(0,0,0,.35);border-radius:10px}
.step button{width:40px;height:38px;font-size:20px;font-weight:700}
.step b{min-width:26px;text-align:center;font:400 16px "Russo One",system-ui,sans-serif}
.tool{display:flex;gap:6px;margin-top:6px}
.tool button{flex:1;min-height:40px;border-radius:10px;background:rgba(0,0,0,.35);font-size:15px}
details.gen{margin-top:10px;background:var(--panel);border-radius:12px;padding:8px 10px}
details.gen summary{min-height:32px;font-weight:600;color:var(--mut)}
pre.gencode{margin:6px 0 0;font:13px/1.55 "JetBrains Mono",monospace;color:#d9e6ff;white-space:pre;overflow-x:auto}
/* editor kode */
.ed{display:flex;background:#080c20;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:220px;max-height:60vh}
.gut{flex:none;width:36px;overflow:hidden;text-align:right;padding:10px 6px 10px 0;font:16px/24px "JetBrains Mono",monospace;color:rgba(255,255,255,.28);background:#0b1130;user-select:none}
.gut div.bad{background:#ff3b5c;color:#fff;border-radius:0 6px 6px 0}
textarea#ta{flex:1;min-width:0;background:transparent;color:#e3ecff;border:0;outline:0;resize:none;padding:10px 10px;font:16px/24px "JetBrains Mono",monospace;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--gold)}
.err{margin-top:10px;background:#3a1020;border:1px solid var(--red);color:#ffd3da;border-radius:12px;padding:10px 12px;font-size:14px}
.err b{color:#fff}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#10173a;border-top:1px solid var(--line);padding:4px 6px;max-width:520px;margin:0 auto}
.chips .row{display:flex;gap:6px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
.chips .row::-webkit-scrollbar{display:none}
.chips button{flex:none;min-width:44px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 15px "JetBrains Mono",monospace}
.chips button.kw{color:#ffb4e8}.chips button.ac{color:#8fd0ff}
/* sheet */
#veil{position:fixed;inset:0;background:rgba(3,5,16,.7);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:#121a3a;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px 16px calc(20px + var(--safe-b));z-index:50;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:4px auto 10px}
.sheet h2{margin:2px 0 4px;font:400 22px "Russo One",sans-serif}
.sheet .row2{display:flex;gap:8px;margin-top:12px}
.sheet .row2 .primary,.sheet .row2 .ghost{flex:1}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pal button{min-height:52px;border-radius:12px;font-weight:600;color:#fff;padding:6px}
.res-card{width:100%;border-radius:14px;display:block;margin:8px 0;border:1px solid var(--line);aspect-ratio:1080/1350;background:#0c1230}
.bigstars{font-size:38px;text-align:center;letter-spacing:6px;color:var(--gold);margin:4px 0}
.bigstars s{text-decoration:none;color:rgba(255,255,255,.18)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid canvas{width:100%;aspect-ratio:1080/1350;border-radius:12px;border:1px solid var(--line);background:#0c1230}
.grid button{padding:0;border-radius:12px;display:block}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px;color:var(--mut);font-size:13px}
input[type=text],select{width:100%;min-height:46px;border-radius:12px;background:#080c20;color:var(--ink);border:1px solid var(--line);padding:0 12px;font:16px Lexend}
select{padding:0 8px;min-height:44px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;min-height:52px;width:100%;text-align:left}
.sw small{display:block;color:var(--mut)}
.sw .tg{flex:none;width:46px;height:26px;border-radius:99px;background:#33406b;position:relative}
.sw .tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tg{background:var(--green)}.sw.on .tg::after{left:23px}
.dict h3{margin:14px 0 4px;font:400 15px "Russo One",system-ui,sans-serif;color:var(--gold)}
.dict dl{margin:0}.dict dt{font:600 14px "JetBrains Mono",monospace;color:#8fd0ff;margin-top:6px}.dict dd{margin:0 0 0 0;color:var(--ink);font-size:14px}
/* kuis */
.qbody{padding-top:8px}
.qstory{color:var(--mut);margin:4px 0 12px}
.qlabel{font:600 12px Lexend;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.qcode{background:#080c20;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;font:15px/1.6 "JetBrains Mono",monospace;overflow-x:auto;color:#e3ecff}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qopts button{min-height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font:400 18px "Russo One",system-ui,sans-serif;padding:8px}
.qopts button.ok{background:#12603a;border-color:var(--green)}
.qopts button.no{background:#5a1526;border-color:var(--red)}
.qopts button:disabled{opacity:1}
.qfb{margin-top:12px;background:var(--panel);border-radius:12px;padding:10px 12px}
.dots{display:flex;gap:4px;width:auto;padding:0 8px;background:none;border:0}
.dots i{width:10px;height:10px;border-radius:50%;background:#33406b}.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{outline:2px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#fff;color:#10163a;font-weight:600;padding:10px 16px;border-radius:99px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (max-height:620px){.pane{padding-bottom:80px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* halaman awal */
.hub{padding-top:18px}
.hubhead{margin:4px 0 16px}
.hi.big{font-size:28px}
.gcard{display:grid;gap:6px;width:100%;text-align:left;padding:14px;border-radius:20px;margin:0 0 14px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.gcard:active{transform:scale(.985)}
.gcard.robo{background:linear-gradient(160deg,#14346f,#0f2250 70%)}
.gcard.arena{background:linear-gradient(160deg,#5a1230,#241136 70%)}
.gcard .art{width:100%;aspect-ratio:120/52;border-radius:12px;display:block;margin-bottom:6px}
.gcard .gt{font:400 24px/1.1 "Russo One",system-ui,sans-serif}
.gcard .gd{color:#c8d3f5;font-size:14px}
.gcard .gp{display:inline-block;justify-self:start;margin-top:4px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font:600 13px Lexend,sans-serif;color:var(--gold)}
.hubnote{text-align:center;margin-top:4px}
#roboFrame{flex:1;min-height:0;width:100%;border:0;background:#EAF1FA;border-top:1px solid var(--line)}
@media (min-width:480px){.hub{padding-inline:20px}}
.wide-btn{width:100%;margin:0 0 12px}

</style>
</head>
<body>
<div id="app">
  <section id="s-hub" class="screen">
    <div class="scroll hub">
      <div class="hubhead"><div class="hi big">Pilih Permainan</div><div class="sub">Dua game untuk melatih otak seorang programmer.</div></div>
      <button class="gcard robo" id="goRobo" type="button">
        <svg viewBox="0 14 120 52" preserveAspectRatio="xMidYMid slice" class="art" aria-hidden="true"><g fill="none"><rect x="6" y="6" width="108" height="68" rx="10" fill="#dfeaff"/><path d="M20 20H60V50H100" stroke="#2457E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/><rect x="14" y="14" width="14" height="14" rx="4" fill="#1AA6B7"/><circle cx="19" cy="21" r="2" fill="#0D2C37"/><circle cx="24" cy="21" r="2" fill="#0D2C37"/><path d="M60 52l12-8v16z" fill="#EF4458" transform="translate(30 -4)"/><path d="M84 36l9 7-9 7z" fill="#FFC21A"/><rect x="54" y="50" width="10" height="10" fill="#8392AE" rx="3"/></g></svg>
        <span class="gt">Robo Labirin</span>
        <span class="gd">Susun blok perintah, antar robot ke bendera. 20 level, dari mudah sampai labirin raksasa.</span>
        <span class="gp" id="hubRobo"></span>
      </button>
      <button class="gcard arena" id="goArena" type="button">
        <svg viewBox="0 14 120 52" preserveAspectRatio="xMidYMid slice" class="art" aria-hidden="true"><g fill="none"><rect x="6" y="6" width="108" height="68" rx="10" fill="#10163a"/><path d="M20 58h80" stroke="#2c4a3c" stroke-width="6" stroke-linecap="round"/><path d="M26 56V30l8-6 8 6v26z" fill="#3d8bff"/><path d="M78 56V30l8-6 8 6v26z" fill="#ff3b5c"/><path d="M52 52 68 28M66 28h4v4" stroke="#ffc83d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
        <span class="gt">Arena Kode</span>
        <span class="gd">Game ala MOBA: tulis kode untuk hero, menangkan pertarungan. 24 misi sampai level ahli.</span>
        <span class="gp" id="hubArena"></span>
      </button>
      <button class="ghost wide-btn" id="btnInstall" type="button" hidden>📲 Pasang sebagai aplikasi</button>
      <p class="sub hubnote" id="iosHint" hidden>Di iPhone: ketuk tombol Bagikan, lalu pilih <b>Tambah ke Layar Utama</b>.</p>
      <p class="sub hubnote">Kemajuan dan bintang tiap game tersimpan di HP ini.</p>
    </div>
  </section>
  <section id="s-robo" class="screen" hidden>
    <header class="bar"><button class="ib" id="roboBack" aria-label="Kembali ke pilihan game">‹</button><div class="ttl"><b>Robo Labirin</b><small>20 level</small></div></header>
    <iframe id="roboFrame" title="Robo Labirin"></iframe>
  </section>
  <section id="s-home" class="screen tabscr">
    <header class="top"><div><div class="hi" id="hiName">Halo!</div><div class="sub" id="hiSub"></div></div><div style="display:flex;gap:8px;align-items:center"><div class="starsum" id="starSum">★ 0/72</div><button class="ib" id="btnHub" aria-label="Menu pilihan game">⌂</button></div></header>
    <div class="scroll" id="rankList"></div>
  </section>
  <section id="s-trophy" class="screen tabscr" hidden>
    <header class="top"><div><div class="hi">🏆 Piala</div><div class="sub" id="trSub"></div></div></header>
    <div class="scroll"><div id="trGrid" class="grid"></div></div>
  </section>
  <section id="s-profile" class="screen tabscr" hidden>
    <header class="top"><div><div class="hi">👤 Profil</div><div class="sub">Atur namamu dan pengaturan lain</div></div></header>
    <div class="scroll" id="profBody"></div>
  </section>
  <nav id="nav">
    <button data-tab="home" class="on"><i>🗺</i>Misi</button>
    <button data-tab="trophy"><i>🏆</i>Piala</button>
    <button data-tab="profile"><i>👤</i>Profil</button>
  </nav>

  <section id="s-play" class="screen" hidden>

<script>
const ROBO_SRC = "\u003c!doctype html>\u003chtml lang=\"id\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Robo Labirin\u003c/title>\u003cstyle>@font-face{font-family:\"Lexend\";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"Lexend\";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-600-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"Russo One\";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/russo-one-latin-400-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"JetBrains Mono\";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"JetBrains Mono\";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"Baloo 2\";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format(\"woff2\")}\n@font-face{font-family:\"Baloo 2\";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format(\"woff2\")}\n/* Satu halaman permainan: papan labirin di atas, rak blok di bawah. Layar lebar: papan di kiri (menempel), susunan program di kanan. */\n:root {\n  --bg: #EAF1FA; --surface: #FFFFFF; --well: #F1F6FD; --ink: #14213D; --muted: #4F5F80; --line: #CBD8EA;\n  --tile-a: #F6FAFF; --tile-b: #E4EEFB; --rock: #8392AE; --rock-hi: #A9B6CD;\n  --gem: #FFC21A; --gem-dk: #D98E00; --goal: #EF4458; --pole: #34445F;\n  --robot: #1AA6B7; --robot-dk: #0E7482; --face: #0D2C37; --eye: #8CF6FF; --wheel: #34445F;\n  --move: #2457E6; --move-ink: #FFFFFF;\n  --turn: #6B46E0; --turn-ink: #FFFFFF;\n  --loop: #FFA03A; --loop-ink: #2B1700;\n  --cond: #C2185B; --cond-ink: #FFFFFF;\n  --go: #0E8A43; --go-dk: #0A6430; --go-ink: #FFFFFF; --stop: #C62839;\n  --info-bg: #E3EEFB; --ok-bg: #DDF4E8; --ok: #0B7D58; --warn-bg: #FFF0D1; --warn: #9A6200;\n  --star: #F5A700; --hl: #FFC21A; --focus: #2457E6; --veil: rgba(8, 16, 36, .6);\n  --display: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;\n  --body: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #0D1730; --surface: #15233F; --well: #1B2C4E; --ink: #E8EEFF; --muted: #A3B3D3; --line: #2C3F66;\n    --tile-a: #22365F; --tile-b: #1A2B4D; --rock: #62729A; --rock-hi: #8393B8;\n    --gem: #FFC84A; --gem-dk: #E0A000; --goal: #FF6577; --pole: #AEBBD8;\n    --robot: #35C7D8; --robot-dk: #1B8E9C; --face: #0A222C; --eye: #8CF6FF; --wheel: #7C8DB2;\n    --move: #7BA0FF; --move-ink: #08122E;\n    --turn: #AD97FF; --turn-ink: #140A33;\n    --loop: #FFB75F; --loop-ink: #2B1700;\n    --cond: #FF86B8; --cond-ink: #3A0A20;\n    --go: #3DDB84; --go-dk: #1E9B57; --go-ink: #052A16; --stop: #FF7A88;\n    --info-bg: #1B2C4E; --ok-bg: #12372A; --ok: #3DDB84; --warn-bg: #3B2E10; --warn: #FFC066;\n    --star: #FFC21A; --hl: #FFC21A; --focus: #9DB8FF; --veil: rgba(2, 6, 16, .72);\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #0D1730; --surface: #15233F; --well: #1B2C4E; --ink: #E8EEFF; --muted: #A3B3D3; --line: #2C3F66;\n  --tile-a: #22365F; --tile-b: #1A2B4D; --rock: #62729A; --rock-hi: #8393B8;\n  --gem: #FFC84A; --gem-dk: #E0A000; --goal: #FF6577; --pole: #AEBBD8;\n  --robot: #35C7D8; --robot-dk: #1B8E9C; --face: #0A222C; --eye: #8CF6FF; --wheel: #7C8DB2;\n  --move: #7BA0FF; --move-ink: #08122E;\n  --turn: #AD97FF; --turn-ink: #140A33;\n  --loop: #FFB75F; --loop-ink: #2B1700;\n  --cond: #FF86B8; --cond-ink: #3A0A20;\n  --go: #3DDB84; --go-dk: #1E9B57; --go-ink: #052A16; --stop: #FF7A88;\n  --info-bg: #1B2C4E; --ok-bg: #12372A; --ok: #3DDB84; --warn-bg: #3B2E10; --warn: #FFC066;\n  --star: #FFC21A; --hl: #FFC21A; --focus: #9DB8FF; --veil: rgba(2, 6, 16, .72);\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nbody {\n  background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body);\n  padding-block: 12px 32px; padding-inline: 16px;\n}\n.app { max-width: 1040px; margin-inline: auto; display: grid; gap: 14px; }\nh1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }\nh1 { font-size: 1.75rem; font-weight: 800; }\nh2 { font-size: 1.55rem; font-weight: 800; }\n.h-sm { font-size: 1.15rem; font-weight: 800; }\np { margin: 0; }\n\n.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }\n.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }\n.mascot { width: 46px; height: 46px; flex: none; }\n\n.btn {\n  font: 600 1rem/1 var(--body); min-height: 48px; padding: 0 18px; border-radius: 14px;\n  border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 3px 0 var(--line);\n}\n.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }\n.btn:disabled { opacity: .5; cursor: not-allowed; }\n.btn.ghost { background: transparent; box-shadow: none; }\n.btn.small { min-height: 40px; padding: 0 12px; font-size: .9rem; }\n.btn.run { background: var(--go); color: var(--go-ink); border-color: var(--go); box-shadow: 0 3px 0 var(--go-dk); flex: 2 1 160px; font-size: 1.1rem; }\n.btn.run.stop { background: var(--stop); border-color: var(--stop); box-shadow: 0 3px 0 rgba(0, 0, 0, .3); }\n.btn svg { flex: none; }\nbutton:focus-visible, .slot:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }\n\n.layout { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }\n.stage, .coder { display: grid; gap: 12px; align-content: start; min-width: 0; }\n\n.eyebrow {\n  margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;\n  font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--muted);\n}\n.tag {\n  background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px;\n  letter-spacing: .02em; text-transform: none; font-size: .85rem; color: var(--ink);\n}\n.mission p { margin-top: 6px; max-width: 62ch; color: var(--muted); }\n\n.board-wrap { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 10px; display: grid; place-items: center; }\n#board { width: 100%; max-width: 460px; height: auto; display: block; }\n.t0 { fill: var(--tile-a); } .t1 { fill: var(--tile-b); }\n.rock { fill: var(--rock); } .rock-hi { stroke: var(--rock-hi); stroke-width: 4; fill: none; stroke-linecap: round; }\n.pole { fill: var(--pole); } .flag { fill: var(--goal); }\n.gem-body { fill: var(--gem); stroke: var(--gem-dk); stroke-width: 2.5; stroke-linejoin: round; }\n.gem-hi { fill: #fff; opacity: .6; }\n.gem { transition: opacity .25s; } .gem.gone { opacity: 0; }\n.robot-pos { transition: transform .34s ease-in-out; }\n.robot-rot { transition: transform .28s ease-in-out; }\n.r-body { fill: var(--robot); } .r-face { fill: var(--face); } .r-eye { fill: var(--eye); }\n.r-wheel { fill: var(--wheel); } .r-ant { stroke: var(--robot-dk); stroke-width: 3; stroke-linecap: round; } .r-tip { fill: var(--goal); }\n.bump { animation: wobble .4s; }\n@keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }\n\n.status {\n  border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--info-bg);\n  min-height: 56px; display: flex; align-items: center;\n}\n.status.ok { background: var(--ok-bg); border-color: var(--ok); }\n.status.warn { background: var(--warn-bg); border-color: var(--warn); }\n.controls { display: flex; gap: 10px; flex-wrap: wrap; }\n.controls .btn:not(.run) { flex: 1 1 90px; }\n.hint { background: var(--surface); border: 2px dashed var(--line); border-radius: 14px; padding: 10px 14px; }\n\n.palette { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }\n.move { --c: var(--move); --ci: var(--move-ink); }\n.turn { --c: var(--turn); --ci: var(--turn-ink); }\n.loop { --c: var(--loop); --ci: var(--loop-ink); }\n.cond { --c: var(--cond); --ci: var(--cond-ink); }\n.pal {\n  display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 8px 14px; border-radius: 14px; border: 0;\n  background: var(--c); color: var(--ci); font: 600 1rem/1.2 var(--body); text-align: left; cursor: pointer;\n  box-shadow: 0 3px 0 color-mix(in srgb, var(--c) 65%, #000);\n}\n.pal:active { transform: translateY(2px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 65%, #000); }\n.pal:disabled { opacity: .5; cursor: not-allowed; }\n\n.prog-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }\n.prog-head .count { margin-right: auto; color: var(--muted); font-size: .9rem; }\n.prog { background: var(--surface); border: 2px dashed var(--line); border-radius: 18px; padding: 10px; min-height: 130px; display: flex; flex-direction: column; }\n.locked .prog, .locked .palette { opacity: .7; }\n\n.slot { appearance: none; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; position: relative; height: 24px; width: 100%; cursor: pointer; color: var(--muted); font: 400 .85rem/1 var(--body); flex: none; }\n.slot::after { content: \"\"; position: absolute; left: 10px; right: 10px; top: 11px; height: 2px; border-radius: 2px; background: var(--line); }\n.slot.on { height: 44px; }\n.slot.on::after { top: 2px; bottom: 2px; left: 0; right: 0; height: auto; background: transparent; border: 2px dashed var(--muted); border-radius: 10px; }\n.slot span { position: relative; z-index: 1; }\n\n.b { border-radius: 12px; background: var(--c); color: var(--ci); font-weight: 600; flex: none; }\n.b.row { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 4px 4px 12px; }\n.b.cb { padding-bottom: 10px; }\n.b.cb > .head { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 4px 4px 12px; flex-wrap: nowrap; }\n.b.cb > .head .grow { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }\n.b.cb > .body { margin: 0 10px 0 18px; background: var(--well); border-radius: 10px; padding: 2px 8px; color: var(--ink); }\n.b.running { box-shadow: 0 0 0 4px var(--hl); }\n.b .lbl { flex: 1 1 auto; min-width: 0; }\n.x { appearance: none; border: 0; border-radius: 10px; width: 40px; height: 40px; flex: none; background: rgba(0, 0, 0, .18); color: inherit; font: 700 1.4rem/1 var(--body); cursor: pointer; }\n.stepper { display: inline-flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, .16); border-radius: 12px; padding: 3px; }\n.stepper button { appearance: none; border: 0; width: 38px; height: 38px; border-radius: 10px; background: var(--surface); color: var(--ink); font: 800 1.2rem/1 var(--body); cursor: pointer; }\n.stepper b { min-width: 30px; text-align: center; font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }\n.empty { color: var(--muted); padding: 10px 6px 2px; }\n\n.overlay { position: fixed; inset: 0; background: var(--veil); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); z-index: 10; overflow: auto; }\n.card { background: var(--surface); color: var(--ink); border-radius: 22px; padding: 20px; width: 100%; max-width: 480px; display: grid; gap: 14px; max-height: 100%; overflow: auto; }\n.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }\n.level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }\n.lv { appearance: none; text-align: left; display: grid; gap: 4px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--well); color: var(--ink); font: 600 .9rem/1.25 var(--body); cursor: pointer; }\n.lv.now { border-color: var(--focus); }\n.lv .n { font: 800 1.6rem/1 var(--display); }\n.stars { display: inline-flex; gap: 2px; }\n.stars svg { width: 20px; height: 20px; }\n.s-on { fill: var(--star); } .s-off { fill: var(--line); }\n.win { text-align: center; justify-items: center; }\n.win .stars svg { width: 52px; height: 52px; }\n.win .stars svg.s-on { animation: pop .5s both; }\n.win .stars svg:nth-child(2) { animation-delay: .15s; } .win .stars svg:nth-child(3) { animation-delay: .3s; }\n@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }\n.win .learn { color: var(--muted); max-width: 40ch; }\n.win .acts { display: grid; gap: 10px; width: 100%; }\n\n@media (min-width: 880px) {\n  .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }\n  .stage { position: sticky; top: 12px; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .robot-pos, .robot-rot, .gem { transition: none; }\n  .bump, .win .stars svg.s-on { animation: none; }\n}\n\u003c/style>\u003c/head>\u003cbody>\u003cdiv class=\"app\" id=\"app\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brand\">\n      \u003csvg class=\"mascot\" viewBox=\"-30 -30 60 60\" aria-hidden=\"true\">\u003c/svg>\n      \u003ch1>Robo Labirin\u003c/h1>\n    \u003c/div>\n    \u003cbutton class=\"btn\" data-act=\"levels\" type=\"button\">Daftar level\u003c/button>\n  \u003c/header>\n\n  \u003cmain class=\"layout\" id=\"layout\">\n    \u003csection class=\"stage\" aria-label=\"Papan permainan\">\n      \u003cdiv class=\"mission\">\n        \u003cp class=\"eyebrow\">\u003cspan id=\"lvNum\">\u003c/span>\u003cspan id=\"lvConcept\" class=\"tag\">\u003c/span>\u003c/p>\n        \u003ch2 id=\"lvName\">\u003c/h2>\n        \u003cp id=\"lvMission\">\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"board-wrap\">\u003csvg id=\"board\" role=\"img\" aria-label=\"Papan labirin dengan robot, permata, batu, dan bendera\">\u003c/svg>\u003c/div>\n      \u003cdiv id=\"status\" class=\"status\" role=\"status\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"controls\">\n        \u003cbutton id=\"btnRun\" class=\"btn run\" data-act=\"run\" type=\"button\">\u003c/button>\n        \u003cbutton class=\"btn\" data-act=\"reset\" type=\"button\">Ulang\u003c/button>\n        \u003cbutton class=\"btn ghost\" data-act=\"hint\" type=\"button\">Petunjuk\u003c/button>\n      \u003c/div>\n      \u003cp id=\"hint\" class=\"hint\" hidden>\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"coder\" aria-label=\"Menyusun program\">\n      \u003ch3 class=\"h-sm\">Blok perintah\u003c/h3>\n      \u003cdiv id=\"palette\" class=\"palette\">\u003c/div>\n      \u003cdiv class=\"prog-head\">\n        \u003ch3 class=\"h-sm\">Programmu\u003c/h3>\n        \u003cspan id=\"count\" class=\"count\">\u003c/span>\n        \u003cbutton class=\"btn ghost small\" data-act=\"clear\" type=\"button\">Hapus semua\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"prog\" class=\"prog\">\u003c/div>\n    \u003c/section>\n  \u003c/main>\n\n  \u003cdiv id=\"levels\" class=\"overlay\" hidden>\n    \u003cdiv class=\"card\" role=\"dialog\" aria-label=\"Pilih level\">\n      \u003cdiv class=\"card-head\">\u003ch2>Pilih level\u003c/h2>\u003cbutton class=\"btn small\" data-act=\"close\" type=\"button\">Tutup\u003c/button>\u003c/div>\n      \u003cdiv id=\"levelGrid\" class=\"level-grid\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"win\" class=\"overlay\" hidden>\n    \u003cdiv class=\"card win\" role=\"dialog\" aria-label=\"Level selesai\">\n      \u003ch2>Hebat, berhasil!\u003c/h2>\n      \u003cdiv id=\"winStars\" class=\"stars\" aria-hidden=\"true\">\u003c/div>\n      \u003cp id=\"winText\">\u003c/p>\n      \u003cp id=\"winLearn\" class=\"learn\">\u003c/p>\n      \u003cdiv class=\"acts\">\n        \u003cbutton id=\"btnNext\" class=\"btn run\" data-act=\"next\" type=\"button\">Level berikutnya\u003c/button>\n        \u003cbutton class=\"btn\" data-act=\"again\" type=\"button\">Coba lebih hemat\u003c/button>\n        \u003cbutton class=\"btn ghost\" data-act=\"levels\" type=\"button\">Daftar level\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cscript>'use strict';\n/* Logika Robo Labirin: level, penerjemah program, penghitung blok. Tidak menyentuh DOM supaya bisa diuji di Node. */\nconst CELL = 60;\nconst DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // atas, kanan, bawah, kiri\nlet _uid = 0;\nconst uid = () => 'n' + (++_uid);\nconst F = () => ({ id: uid(), t: 'F' });\nconst L = () => ({ id: uid(), t: 'L' });\nconst R = () => ({ id: uid(), t: 'R' });\nconst REP = (n, ...body) => ({ id: uid(), t: 'rep', n, body });\nconst IF = (...body) => ({ id: uid(), t: 'if', body });\nconst WF = (...body) => ({ id: uid(), t: 'wf', body });\n\n/* Peta: # batu, * permata, G bendera, S posisi awal, . kosong. dir: 0 atas, 1 kanan, 2 bawah, 3 kiri. */\nconst LEVELS = [\n  {\n    name: 'Maju terus!', concept: 'Urutan perintah',\n    mission: 'Bawa robot ke bendera. Robot hanya mengerjakan blokmu, satu per satu dari atas ke bawah.',\n    hint: 'Bendera ada 4 petak di depan robot. Ketuk Maju sebanyak 4 kali.',\n    learn: 'Program adalah urutan perintah. Robot mengerjakannya berurutan, tanpa melompat.',\n    rows: ['..#..', 'S...G', '.#...'], dir: 1,\n    allow: ['F'], max: 0, par: 4,\n    solution: () => [F(), F(), F(), F()]\n  },\n  {\n    name: 'Belok dulu', concept: 'Urutan perintah',\n    mission: 'Ada jalan lurus lalu belok. Susun blok Maju dan Belok supaya robot sampai di bendera.',\n    hint: 'Maju 3 kali ke kanan, Belok kanan, lalu Maju 3 kali ke bawah.',\n    learn: 'Urutan yang berbeda menghasilkan jalan yang berbeda. Belok di tempat yang salah, robot tersesat.',\n    rows: ['S....', '.#...', '..#..', '...G.'], dir: 1,\n    allow: ['F', 'L', 'R'], max: 0, par: 7,\n    solution: () => [F(), F(), F(), R(), F(), F(), F()]\n  },\n  {\n    name: 'Kumpulkan permata', concept: 'Urutan perintah',\n    mission: 'Ambil dua permata kuning dulu, baru sampai di bendera. Robot mengambil permata dengan melewatinya.',\n    hint: 'Jalan di baris atas sampai ujung, Belok kanan, lalu turun sampai bendera. Kedua permata ada di jalan itu.',\n    learn: 'Kamu merencanakan rute lebih dulu, baru menyusun blok. Merencanakan itu bagian dari programming.',\n    rows: ['S.*..', '.###.', '....*', '.##..', '....G'], dir: 1,\n    allow: ['F', 'L', 'R'], max: 0, par: 9,\n    solution: () => [F(), F(), F(), F(), R(), F(), F(), F(), F()]\n  },\n  {\n    name: 'Jalan panjang', concept: 'Perulangan (loop)',\n    mission: 'Jalannya panjang sekali. Bloknya dibatasi 3, jadi pakai blok Ulangi supaya hemat.',\n    hint: 'Ketuk Ulangi, lalu ketuk Maju (blok Maju masuk ke dalam Ulangi). Atur jumlah ulangannya jadi 6.',\n    learn: 'Perulangan (loop) mengulang blok yang sama. Satu blok Ulangi bisa menggantikan banyak blok.',\n    rows: ['.#...#.', 'S.*.*.G', '..#.#..'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 3, par: 2,\n    solution: () => [REP(6, F())]\n  },\n  {\n    name: 'Naik tangga', concept: 'Perulangan (loop)',\n    mission: 'Jalan robot berbentuk tangga. Cari pola yang berulang, lalu masukkan ke blok Ulangi.',\n    hint: 'Satu anak tangga: Maju, Belok kanan, Maju, Belok kiri. Ulangi pola itu 3 kali.',\n    learn: 'Perulangan tidak hanya untuk satu blok. Kamu bisa mengulang sekelompok blok sekaligus.',\n    rows: ['S.###', '#.*#.', '.#.*.', '...G.', '..#..'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 6, par: 5,\n    solution: () => [REP(3, F(), R(), F(), L())]\n  },\n  {\n    name: 'Keliling kotak', concept: 'Perulangan (loop)',\n    mission: 'Ambil tiga permata di sudut kotak, lalu berhenti di bendera. Ada pola Maju, Maju, Belok yang berulang.',\n    hint: 'Ulangi 3 kali: Maju, Maju, Belok kanan. Setelah itu Maju satu kali lagi untuk sampai di bendera.',\n    learn: 'Mengenali pola adalah kunci perulangan. Pola yang sama muncul di setiap sisi kotak.',\n    rows: ['#...#', '.S.*.', '.G#..', '.*.*.', '#...#'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 6, par: 5,\n    solution: () => [REP(3, F(), F(), R()), F()]\n  },\n  {\n    name: 'Ada halangan!', concept: 'Kondisi (jika)',\n    mission: 'Robot harus berputar mengelilingi tepi papan. Pakai blok Jika: kalau ada halangan di depan, Belok kanan.',\n    hint: 'Ulangi 10 kali: Jika ada halangan di depan, Belok kanan. Lalu Maju. Blok Maju diletakkan di bawah blok Jika, bukan di dalamnya.',\n    learn: 'Kondisi (jika) membuat robot memutuskan sendiri. Robot memeriksa dulu, baru bertindak.',\n    rows: ['S...', '.##.', 'G##.', '*..*'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'if'], max: 5, par: 4,\n    solution: () => [REP(10, IF(R()), F())]\n  },\n  {\n    name: 'Memutari batu', concept: 'Urutan dan perulangan',\n    mission: 'Ada batu menghalangi jalan lurus. Cari jalan memutar, ambil dua permata, lalu ke bendera.',\n    hint: 'Maju 3 kali, Belok kiri, Maju, Belok kanan, Maju 2 kali, Belok kanan, Maju, Belok kiri, Maju 2 kali. Blok Ulangi bisa menghemat beberapa blok.',\n    learn: 'Masalah besar bisa dipecah menjadi langkah kecil: lurus, menghindar, lurus lagi.',\n    rows: ['..#...#.', '....*...', 'S...#*.G', '.#...#..', '........'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 0, par: 12,\n    solution: () => [REP(3, F()), L(), F(), R(), REP(2, F()), R(), F(), L(), REP(2, F())]\n  },\n  {\n    name: 'Putar ke kiri', concept: 'Kondisi (jika)',\n    mission: 'Sekarang robot berputar ke arah sebaliknya. Ambil tiga permata di sudut, lalu sampai di bendera.',\n    hint: 'Polanya sama dengan level 7, tetapi robot belok kiri. Coba ulangi 14 kali.',\n    learn: 'Pola yang sama bisa dipakai di tempat lain. Kamu tinggal mengganti bagian yang berbeda.',\n    rows: ['*....S', '.####.', '.####G', '*....*'], dir: 3,\n    allow: ['F', 'L', 'R', 'rep', 'if'], max: 5, par: 4,\n    solution: () => [REP(14, IF(L()), F())]\n  },\n  {\n    name: 'Cari kesalahan', concept: 'Mencari bug',\n    mission: 'Program ini sudah tersusun, tetapi punya 2 kesalahan (bug). Jalankan, lihat di mana robot salah, lalu perbaiki.',\n    hint: 'Kesalahan pertama: jalan di baris atas lebih panjang dari yang diulang. Kesalahan kedua: robot harus belok ke arah lain.',\n    learn: 'Bug adalah kesalahan di program. Programmer hebat menjalankan, mengamati, lalu memperbaiki.',\n    rows: ['S.*..', '.#.#.', '.#.#*', '.#...', '....G'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 7, par: 5,\n    start: () => [REP(3, F()), L(), REP(4, F())],\n    solution: () => [REP(4, F()), R(), REP(4, F())]\n  }\n\n  ,{\n    name: 'Tangga lebar', concept: 'Perulangan (loop)',\n    mission: 'Tangga ini lebar dan panjang. Ambil tiga permata, lalu sampai di bendera. Satu anak tangga terdiri dari beberapa blok yang sama.',\n    hint: 'Satu anak tangga: Maju 2 kali, Belok kanan, Maju, Belok kiri. Masukkan kelima blok itu ke dalam satu blok Ulangi.',\n    learn: 'Kelompok blok yang sama bisa diulang berkali-kali. Cari dulu pola terkecil yang berulang.',\n    rows: ['S..######', '##*..####', '####*..##', '######*..', '########G'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 6, par: 6,\n    solution: () => [REP(4, F(), F(), R(), F(), L())]\n  },\n  {\n    name: 'Lorong tanpa hitungan', concept: 'Ulangi selama (while)',\n    mission: 'Lorong ini panjang sekali dan kamu malas menghitung. Pakai blok baru: Selama jalan kosong, robot terus mengerjakan blok di dalamnya.',\n    hint: 'Ketuk Selama jalan kosong, lalu ketuk Maju (Maju masuk ke dalamnya). Robot berhenti sendiri saat ada batu atau tepi papan.',\n    learn: 'Ulangi selama (while) mengulang sampai suatu keadaan berubah. Kamu tidak perlu tahu berapa kali.',\n    rows: ['#########', 'S.*.*.*.G', '#########'], dir: 1,\n    allow: ['F', 'L', 'R', 'wf'], max: 2, par: 2,\n    solution: () => [WF(F())]\n  },\n  {\n    name: 'Lorong huruf U', concept: 'Ulangi selama + belok',\n    mission: 'Lorong berbentuk huruf U. Setiap lorong lurus berakhir di tembok, lalu robot harus belok kanan. Hemat blok, ya!',\n    hint: 'Satu sisi: Selama jalan kosong Maju, lalu Belok kanan. Ada 3 sisi, jadi bungkus dengan Ulangi 3 kali.',\n    learn: 'Gabungan Ulangi dan Selama sangat kuat: pola \"jalan sampai ujung, lalu belok\" bisa dipakai di lorong apa saja.',\n    rows: ['S.*..', '####*', 'G.*..'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 5, par: 4,\n    solution: () => [REP(3, WF(F()), R())]\n  },\n  {\n    name: 'Keliling kebun', concept: 'Perulangan bersarang',\n    mission: 'Robot mengelilingi kebun berbentuk kotak, mengambil tiga permata di sudut, lalu berhenti di bendera. Sisi kebun sama panjang, jadi ada pola di dalam pola.',\n    hint: 'Satu sisi: Ulangi 4 kali Maju. Lalu Belok kanan. Bungkus keduanya dalam Ulangi 3 kali. Terakhir Maju 3 kali ke bendera.',\n    learn: 'Perulangan boleh di dalam perulangan (bersarang). Pola besar disusun dari pola kecil.',\n    rows: ['S...*', 'G###.', '.###.', '.###.', '*...*'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep'], max: 6, par: 6,\n    solution: () => [REP(3, REP(4, F()), R()), REP(3, F())]\n  },\n  {\n    name: 'Belok berbeda', concept: 'Ulangi selama + belok',\n    mission: 'Kali ini belokannya tidak sama: kanan, lalu kiri. Ambil tiga permata dan sampai di bendera.',\n    hint: 'Selama jalan kosong Maju, Belok kanan, Selama jalan kosong Maju, Belok kiri, Selama jalan kosong Maju.',\n    learn: 'Kalau polanya tidak berulang persis, jangan paksa pakai Ulangi. Susun saja urut dan rapi.',\n    rows: ['S.*.##', '###*##', '###.*G'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 8, par: 8,\n    solution: () => [WF(F()), R(), WF(F()), L(), WF(F())]\n  },\n  {\n    name: 'Spiral kecil', concept: 'Ulangi selama + belok',\n    mission: 'Jalan berputar ke dalam seperti siput. Bendera ada di tengah. Hanya 4 blok yang boleh dipakai!',\n    hint: 'Ulangi: Selama jalan kosong Maju, lalu Belok kanan. Hitung ada berapa sisi spiral. Kalau berlebih, robot tetap berputar di tempat.',\n    learn: 'Satu pola kecil yang tepat bisa menyelesaikan masalah yang kelihatannya rumit.',\n    rows: ['S....', '####*', '..G#.', '.###.', '..*..'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 4, par: 4,\n    solution: () => [REP(5, WF(F()), R())]\n  },\n  {\n    name: 'Cari kesalahan 2', concept: 'Mencari bug',\n    mission: 'Lorong berbentuk U, tetapi kali ini berbelok ke kiri. Program sudah tersusun, tetapi ada 2 bug. Jalankan, amati, lalu perbaiki.',\n    hint: 'Bug pertama: robot harus Belok kiri (bukan kanan). Bug kedua: jumlah ulangan kurang satu.',\n    learn: 'Bug sering kecil: satu arah atau satu angka. Kuncinya mengamati di blok mana robot mulai salah.',\n    rows: ['G.*..', '####*', 'S.*..'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 5, par: 4,\n    start: () => [REP(2, WF(F()), R())],\n    solution: () => [REP(3, WF(F()), L())]\n  },\n  {\n    name: 'Putaran besar', concept: 'Kondisi + hitungan',\n    mission: 'Robot harus mengelilingi tepi papan satu putaran penuh dan berhenti tepat di bendera. Kamu perlu menghitung jumlah ulangan yang pas.',\n    hint: 'Ulangi: Jika ada halangan Belok kanan, lalu Maju. Satu putaran sampai bendera butuh 18 langkah.',\n    learn: 'Kadang jawabannya butuh angka yang tepat. Hitung dulu, lalu uji, lalu perbaiki angkanya.',\n    rows: ['S.....*', '.#####.', 'G#####.', '.#####.', '*.....*'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'if'], max: 4, par: 4,\n    solution: () => [REP(18, IF(R()), F())]\n  },\n  {\n    name: 'Spiral besar', concept: 'Ulangi selama + hitungan',\n    mission: 'Spiral raksasa dengan lima permata. Tetap 4 blok saja! Ada berapa sisi lurus sampai bendera di tengah?',\n    hint: 'Sama seperti spiral kecil, tetapi jumlah ulangannya berbeda. Hitung sisi lurus: kanan, bawah, kiri, atas, kanan, bawah, kiri.',\n    learn: 'Pola yang sama bisa dipakai untuk masalah besar. Programmer tidak menulis ulang, ia hanya mengganti angka.',\n    rows: ['S......', '######.', '...*.#.', '.###*#*', '*#G..#.', '.#####.', '...*...'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 4, par: 4,\n    solution: () => [REP(7, WF(F()), R())]\n  },\n  {\n    name: 'Labirin Raja', concept: 'Gabungan semua',\n    mission: 'Tantangan terakhir! Tangga menuju spiral raksasa. Kumpulkan enam permata dan sampai di bendera. Pakai gabungan semua ilmumu.',\n    hint: 'Bagian tangga: Ulangi 3 kali (Maju, Belok kanan, Maju, Belok kiri). Bagian spiral: Ulangi 7 kali (Selama jalan kosong Maju, Belok kanan).',\n    learn: 'Masalah besar dipecah: tangga dulu, spiral kemudian. Setiap bagian punya polanya sendiri.',\n    rows: ['S.#######', '#*.######', '##*.#####', '###......', '#####.##.', '###...*#*', '###*#G.#.', '###.####.', '###..*...'], dir: 1,\n    allow: ['F', 'L', 'R', 'rep', 'wf'], max: 9, par: 9,\n    solution: () => [REP(3, F(), R(), F(), L()), REP(7, WF(F()), R())]\n  }\n];\n\nconst parseCache = new Map();\nfunction parse(lv) {\n  if (parseCache.has(lv)) return parseCache.get(lv);\n  const H = lv.rows.length, W = lv.rows[0].length;\n  const rocks = new Set(), gems = [];\n  let goal = null, start = null;\n  lv.rows.forEach((row, y) => {\n    [...row].forEach((c, x) => {\n      if (c === '#') rocks.add(x + ',' + y);\n      else if (c === '*') gems.push([x, y]);\n      else if (c === 'G') goal = [x, y];\n      else if (c === 'S') start = [x, y];\n    });\n  });\n  const p = { W, H, rocks, gems, goal, start };\n  parseCache.set(lv, p);\n  return p;\n}\n\n/* Menjalankan program dan menghasilkan daftar bingkai animasi. */\nfunction exec(lv, prog) {\n  const P = parse(lv);\n  let x = P.start[0], y = P.start[1], h = lv.dir;\n  const left = new Set(P.gems.map(g => g[0] + ',' + g[1]));\n  const frames = [];\n  let end = null;\n  const snap = (node, ev, extra) => frames.push(Object.assign({ x, y, h, left: [...left], node, ev }, extra || {}));\n  const ahead = () => { const d = ((h % 4) + 4) % 4; return [x + DIRS[d][0], y + DIRS[d][1]]; };\n  const blocked = () => {\n    const a = ahead();\n    return a[0] \u003c 0 || a[1] \u003c 0 || a[0] >= P.W || a[1] >= P.H || P.rocks.has(a[0] + ',' + a[1]);\n  };\n  snap(null, 'start');\n  function run(list) {\n    for (const b of list) {\n      if (end) return;\n      if (frames.length > 700) { end = 'long'; return; }\n      if (b.t === 'F') {\n        if (blocked()) { snap(b.id, 'bump'); end = 'bump'; return; }\n        const a = ahead(); x = a[0]; y = a[1];\n        left.delete(x + ',' + y);\n        snap(b.id, 'move');\n      } else if (b.t === 'L') { h--; snap(b.id, 'turn'); }\n      else if (b.t === 'R') { h++; snap(b.id, 'turn'); }\n      else if (b.t === 'rep') { for (let i = 0; i \u003c b.n && !end; i++) run(b.body); }\n      else if (b.t === 'if') {\n        const c = blocked();\n        snap(b.id, 'check', { cond: c });\n        if (c) run(b.body);\n      } else if (b.t === 'wf') {\n        while (!end) {\n          if (frames.length > 700) { end = 'long'; break; }\n          const c = blocked();\n          snap(b.id, 'wcheck', { cond: c });\n          if (c) break;\n          run(b.body);\n        }\n      }\n    }\n  }\n  run(prog);\n  let status = 'win', reason = null;\n  if (end === 'bump') { status = 'fail'; reason = 'bump'; }\n  else if (end === 'long') { status = 'fail'; reason = 'long'; }\n  else if (!(x === P.goal[0] && y === P.goal[1])) { status = 'fail'; reason = 'goal'; }\n  else if (left.size) { status = 'fail'; reason = 'gems'; }\n  return { frames, status, reason };\n}\n\nfunction countBlocks(list) {\n  let n = 0;\n  for (const b of list) n += 1 + (b.body ? countBlocks(b.body) : 0);\n  return n;\n}\n\nfunction starsFor(lv, n) { return n \u003c= lv.par ? 3 : n \u003c= lv.par + 2 ? 2 : 1; }\n\nif (typeof module !== 'undefined') module.exports = { LEVELS, parse, exec, countBlocks, starsFor, F, L, R, REP, IF, WF };\n\n/* Tampilan dan interaksi Robo Labirin. */\n(function () {\n  const $ = s => document.querySelector(s);\n  const KEY = 'robo-labirin-v1';\n  const ICON = {\n    F: '\u003cpath d=\"M12 20V6M6 11l6-6 6 6\"/>',\n    L: '\u003cpath d=\"M18 20v-6a5 5 0 0 0-5-5H6M10 4 5 9l5 5\"/>',\n    R: '\u003cpath d=\"M6 20v-6a5 5 0 0 1 5-5h7M14 4l5 5-5 5\"/>',\n    rep: '\u003cpath d=\"M4 11a8 8 0 0 1 13.5-5.5L20 8M20 4v4h-4M20 13a8 8 0 0 1-13.5 5.5L4 16M4 20v-4h4\"/>',\n    if: '\u003cpath d=\"M9 9a3 3 0 1 1 4.5 2.6c-1 .6-1.5 1.2-1.5 2.4M12 18h.01\"/>',\n    wf: '\u003cpath d=\"M4 11a8 8 0 0 1 13.5-5.5L20 8M20 4v4h-4M12 20V12M8.5 15.5 12 12l3.5 3.5\"/>',\n    play: '\u003cpath d=\"M7 5l12 7-12 7z\" fill=\"currentColor\"/>',\n    stop: '\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\" fill=\"currentColor\"/>'\n  };\n  const ico = t => '\u003csvg viewBox=\"0 0 24 24\" width=\"24\" height=\"24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">' + ICON[t] + '\u003c/svg>';\n  const LABEL = { F: 'Maju', L: 'Belok kiri', R: 'Belok kanan', rep: 'Ulangi', if: 'Jika ada halangan di depan', wf: 'Selama jalan di depan kosong' };\n  const PAL_LABEL = { F: 'Maju', L: 'Belok kiri', R: 'Belok kanan', rep: 'Ulangi', if: 'Jika ada halangan', wf: 'Selama jalan kosong' };\n  const CLS = { F: 'move', L: 'turn', R: 'turn', rep: 'loop', if: 'cond', wf: 'loop' };\n  const STAR = '\u003csvg viewBox=\"0 0 24 24\" class=\"CLS\">\u003cpolygon points=\"12,2 15,9 22,9.3 16.5,14 18.3,21 12,17 5.7,21 7.5,14 2,9.3 9,9\"/>\u003c/svg>';\n  const REASON = {\n    bump: 'Aduh, robot menabrak batu atau tepi papan. Lihat blok yang menyala tadi, di situ robot salah jalan.',\n    goal: 'Robot belum sampai di bendera. Periksa lagi urutan dan jumlah langkahnya.',\n    gems: 'Robot sudah di bendera,   ['Sensor (mata hero)', [['hp', 'Nyawa hero sekarang.'], ['mana', 'Mana hero.'], ['gold', 'Emas yang dimiliki.'], ['x', 'Posisimu di jalur (0 = markas sendiri).'], ['time', 'Detik sejak mulai.'], ['skill_ready', 'True kalau jurus bisa dipakai.'], ['heal_ready', 'True kalau heal bisa dipakai.'], ['hero_dist', 'Jarak ke hero musuh.'], ['minion_dist', 'Jarak ke minion/boneka terdekat.'], ['tower_dist', 'Jarak ke tower musuh.'], ['danger', 'True kalau kamu di jangkauan tower musuh.'], ['attack_range', 'Jangkauan serangan hero.']]],
  ['Bahasa kode', [['if syarat:', 'Kerjakan isinya hanya jika syarat benar.'], ['elif / else', 'Pilihan lain jika syarat sebelumnya salah.'], ['while syarat:', 'Ulangi selama syarat benar. while True: = selamanya.'], ['for i in range(5):', 'Ulangi 5 kali.'], ['x = 3', 'Simpan nilai di variabel.'], ['def nama(a):', 'Buat fungsi baru. Gunakan return untuk mengirim jawaban.'], ['[1, 2, 3]', 'List: kumpulan nilai. a[0] = item pertama. a.append(4) menambah.'], ['and  or  not', 'dan, atau, bukan.'], ['global x', 'Izinkan fungsi mengubah variabel di luar.'], ['# komentar', 'Catatan untuk manusia, diabaikan komputer.']]]
];
function openDict() {
  openSheet('<h2>📖 Kamus</h2><div class="dict">' + DICT.map(([t, rows]) => '<h3>' + esc(t) + '</h3><dl>' + rows.map(([a, b]) => '<dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd>').join('') + '</dl>').join('') + '</div>');
}
$('#btnDict').addEventListener('click', openDict);

/* ---------- arena & replay ---------- */
const cv = $('#cv'), cx = cv.getContext('2d');
function fitCanvas() { const d = Math.min(window.devicePixelRatio || 1, 3), w = cv.clientWidth || 360; cv.width = Math.round(w * d); cv.height = Math.round(w * d * REND.H / REND.W); cx.setTransform(cv.width / REND.W, 0, 0, cv.width / REND.W, 0, 0); }
window.addEventListener('resize', () => { if (!$('#s-play').hidden) { fitCanvas(); renderFrame(); } });
const frames = () => (S.sim && S.sim.frames.length ? S.sim.frames : [S.startFrame]);
function renderFrame() {
  const fr = frames(), n = fr.length, i = Math.min(Math.floor(S.T), n - 1), p = n > 1 && i < n - 1 ? S.T - i : 0;
  const f0 = fr[i], f1 = fr[Math.min(i + 1, n - 1)];
  if (S.fxI !== i) { S.fxI = i; S.fx = i < n - 1 ? REND.fxFor(f1, f0) : []; if (S.playing && S.fx.length) for (const e of S.fx) { if (e.k === 'num' && e.kind === 'skill') sfx.skill(); else if (e.k === 'num' && e.col === '#58e69b') sfx.heal(); else if (e.k === 'num' && e.v[0] === '-') { sfx.hit(); break; } } updateHud(f0, i); }
  REND.draw(cx, f0, f1, p, performance.now() / 1000, S.fx, p);
}
function updateHud(f, i) {
  const u = f.u.find(x => x.pl); const lim = S.m.scenario.limit;
  $('#hud').innerHTML = u ? '<span>❤ ' + u.hp + '/' + u.max + '</span><span>💧 ' + u.mana + '</span><span>💰 ' + u.gold + '</span><span>⏱ ' + f.t + '/' + lim + '</span>' : '<span>⏱ ' + f.t + '</span>';
}
function loop(ts) {
  S.raf = requestAnimationFrame(loop);
  if ($('#s-play').hidden) return;
  const dt = Math.min(0.1, (ts - S.last) / 1000); S.last = ts;
  if (S.playing && S.sim) {
    S.T += dt * 2 * S.speed;
    const end = S.sim.frames.length - 1;
    if (S.T >= end) { S.T = end; S.playing = false; $('#pbPlay').textContent = '▶'; onPlayEnd(); }
    $('#pbRange').value = S.T;
  }
  renderFrame();
}
$('#pbPlay').onclick = () => { if (!S.sim) return; if (S.T >= S.sim.frames.length - 1) { S.T = 0; S.fxI = -1; S.ended = false; } S.playing = !S.playing; $('#pbPlay').textContent = S.playing ? '⏸' : '▶'; };
$('#pbRange').oninput = e => { S.playing = false; $('#pbPlay').textContent = '▶'; S.T = +e.target.value; S.fxI = -1; };
$('#pbSpd').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $('#pbSpd').textContent = S.speed + '×'; };

/* ---------- membuka misi ---------- */
function setPane(p) {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  ['code', 'info', 'log'].forEach(k => { $('#p-' + k).hidden = k !== p; });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPane(b.dataset.p); });
function openMission(id) {
  const m = MBY(id); S.m = m;
  if (m.kind === 'quiz') { startQuiz(m); return; }
  S.sim = null; S.T = 0; S.playing = false; S.hintN = 0; S.fxI = -1; S.ended = true; S.sel = null;
  showScreen('s-play');
  $('#plTitle').textContent = m.title; $('#plConcept').textContent = RANKS[m.rank].name + ' • ' + m.concept;
  $('#pb').hidden = true; hideErr();
  const blocks = m.kind === 'blocks';
  $('#blkWrap').hidden = !blocks; $('#codeWrap').hidden = blocks; $('#chips').hidden = true;
  if (blocks) { S.tree = P.blocks[m.id] ? JSON.parse(JSON.stringify(P.blocks[m.id])) : JSON.parse(JSON.stringify(m.starter)); renderBlocks(); }
  else { ta.value = P.code[m.id] !== undefined ? P.code[m.id] : m.starter; syncGut(); }
  const pre = SIM.simulate(m.scenario, 'pass');
  S.startFrame = pre.frames[0];
  fitCanvas(); updateHud(S.startFrame, 0); renderInfo(); renderLog([]);
  setPane('code'); $('#btnRun').textContent = '▶ JALANKAN';
  cancelAnimationFrame(S.raf); S.last = performance.now(); S.raf = requestAnimationFrame(loop);
}
function renderInfo(win) {
  const m = S.m, par = m.par;
  const hints = m.hints.slice(0, S.hintN).map((h, i) => '<div class="goal"><i>💡</i><span>' + esc(h) + '</span></div>').join('');
  $('#p-info').innerHTML = '<div class="card"><h4>Cerita</h4><p>' + esc(m.story) + '</p></div>' +
    '<div class="card"><h4>Tujuan</h4><div class="goal"><i>🎯</i><span>' + esc(m.goal) + '</span></div><div class="goal"><i>⏱</i><span>Bintang 2: menang dalam ≤ ' + par.ticks + ' detik</span></div><div class="goal"><i>✂</i><span>Bintang 3: kode ≤ ' + par.lines + ' baris</span></div></div>' +
    (hints ? '<div class="card"><h4>Petunjuk</h4>' + hints + '</div>' : '') +
    (win || cleared(m.id) ? '<div class="card"><h4>Yang kamu pelajari</h4><p>' + esc(m.learn) + '</p></div>' : '');
}
function renderLog(lines, extra) {
  $('#p-log').innerHTML = (extra ? '<div class="logl bad">' + esc(extra) + '</div>' : '') + (lines.length ? lines.map(l => '<div class="logl ' + (l.kind || '') + '">[' + l.tick + 'd] ' + esc(l.text) + '</div>').join('') : (extra ? '' : '<div class="empty">Catatan pertarungan muncul di sini setelah kamu menjalankan kode.</div>'));
}
$('#btnBack').onclick = () => { S.playing = false; if (document.activeElement) document.activeElement.blur(); $('#chips').hidden = true; showTab('home'); };
$('#btnHint').onclick = () => { if (S.hintN < S.m.hints.length) S.hintN++; renderInfo(); setPane('info'); if (S.hintN >= S.m.hints.length) toast('Itu petunjuk terakhir. Semangat!'); };
$('#btnReset').onclick = () => {
  const m = S.m, ok = true;
  if (m.kind === 'blocks') { S.tree = JSON.parse(JSON.stringify(m.starter)); renderBlocks(); } else { ta.value = m.starter; syncGut(); P.code[m.id] = m.starter; save(); }
  hideErr(); S.sim = null; S.T = 0; S.playing = false; S.fxI = -1; $('#pb').hidden = true; updateHud(S.startFrame, 0); toast('Kode dikembalikan ke awal');
};

/* ---------- menjalankan ---------- */
$('#btnRun').onclick = () => {
  if (document.activeElement) document.activeElement.blur();
  const m = S.m; let src;
  if (m.kind === 'blocks') { if (!S.tree.length) { toast('Tambahkan blok dulu (ketuk ＋)'); return; } src = BLK.blocksToCode(S.tree); }
  else { src = ta.value; P.code[m.id] = src; save(); }
  let res;
  try { res = SIM.simulate(m.scenario, src); } catch (e) { toast('Ada masalah teknis: ' + e.message); return; }
  S.src = src; S.res = res; hideErr();
  if (!res.frames.length) { showErr(res.outcome.message, res.outcome.line); setPane('code'); sfx.lose(); return; }
  S.sim = res; S.T = 0; S.fxI = -1; S.playing = true; S.ended = false; S.speed = 1; $('#pbSpd').textContent = '1×';
  $('#pb').hidden = false; $('#pbRange').max = res.frames.length - 1; $('#pbRange').value = 0; $('#pbPlay').textContent = '⏸';
  renderLog(res.log, res.outcome.status === 'error' ? (res.outcome.line ? 'Baris ' + res.outcome.line + ': ' : '') + res.outcome.message : '');
  $('#btnRun').textContent = '▶ JALANKAN LAGI';
  window.scrollTo(0, 0);
};
const REASON = { dead: 'Heromu gugur.', nexus: 'Markasmu hancur.', time: 'Waktu habis sebelum tujuan tercapai.' };
function onPlayEnd() {
  if (S.ended) return; S.ended = true;
  const m = S.m, res = S.res, o = res.outcome, won = o.status === 'win';
  const lines = BLK.codeLines(S.src), ticks = res.stats.ticks;
  const goals = [won, won && ticks <= m.par.ticks, won && lines <= m.par.lines];
  const stars = goals.filter(Boolean).length;
  let h;
  if (won) {
    sfx.win();
    const had = P.stars[m.id] || 0;
    if (stars > had) P.stars[m.id] = stars;
    if (m.kind === 'blocks') P.blocks[m.id] = S.tree; else P.code[m.id] = S.src;
    const added = checkAchievements(m, stars); save();
    S.lastWin = true; renderInfo(true);
    h = '<h2>🎉 Misi selesai!</h2><div class="bigstars">' + starStr(stars) + '</div>' + goalsHtml(goals, m, ticks, lines) + '<p class="sub" style="margin:8px 0"><b>Yang kamu pelajari:</b> ' + esc(m.learn) + '</p>' +
      '<canvas class="res-card" id="rc"></canvas><div class="row2"><button class="primary" id="rShare">📲 Bagikan ke WhatsApp</button></div>' + extraAch(added) +
      '<div class="row2"><button class="ghost" id="rAgain">' + (stars < 3 ? 'Coba bintang lebih' : 'Main lagi') + '</button><button class="ghost" id="rNext">Lanjut ›</button></div>';
    openSheet(h);
    const spec = specFor('m' + m.id); cardCanvas(spec, $('#rc'));
    SHARE.toBlob(spec).then(() => cardCanvas(spec, $('#rc'))).catch(() => {});
    $('#rShare').onclick = () => shareSpec(spec);
    wireExtra(added);
    $('#rAgain').onclick = closeSheet;
    $('#rNext').onclick = () => { closeSheet(); nextMission(); };
  } else {
    sfx.lose();
    const why = o.status === 'error' ? ((o.line ? 'Baris ' + o.line + ': ' : '') + o.message) : (REASON[o.reason] || 'Belum berhasil.');
    h = '<h2>Belum berhasil 😤</h2><p><b>' + esc(why) + '</b></p><p class="sub">Tonton ulang pertarungan (geser garis waktu), cari kapan heromu salah langkah, lalu ubah kodenya. Programmer hebat selalu mencoba lagi!</p><div class="row2"><button class="ghost" id="rHint">💡 Petunjuk</button><button class="primary" id="rAgain">Coba lagi</button></div>';
    openSheet(h);
    $('#rAgain').onclick = closeSheet;
    $('#rHint').onclick = () => { if (S.hintN < m.hints.length) S.hintN++; renderInfo(); closeSheet(); setPane('info'); };
  }
}
function goalsHtml(goals, m, ticks, lines) {
  const L = ['Menang: ' + m.goal, 'Cepat: ' + ticks + ' dari ≤ ' + m.par.ticks + ' detik', 'Ringkas: ' + lines + ' dari ≤ ' + m.par.lines + ' baris'];
  return '<div class="card">' + L.map((t, i) => '<div class="goal' + (goals[i] ? ' ok' : '') + '"><i>' + (goals[i] ? '★' : '☆') + '</i><span>' + esc(t) + '</span></div>').join('') + '</div>';
}
function extraAch(added) {
  const ex = added.filter(k => k[0] !== 'm'); if (!ex.length) return '';
  return '<h2 style="margin-top:16px">✨ Pencapaian baru!</h2><div class="thumbs">' + ex.map(k => '<button data-x="' + k + '" style="padding:0"><canvas width="540" height="675" class="xc" style="width:100%;aspect-ratio:1080/1350;border-radius:10px;border:1px solid var(--line)"></canvas></button>').join('') + '</div>';
}
function wireExtra(added) {
  const ex = added.filter(k => k[0] !== 'm'); const cs = $$('#sheetBody .xc');
  ex.forEach((k, i) => { const s = specFor(k); if (s && cs[i]) cardCanvas(s, cs[i]); });
  $$('#sheetBody [data-x]').forEach(b => b.onclick = () => { const s = specFor(b.dataset.x); if (s) shareSpec(s); });
}
function nextMission() {
  const n = MBY(S.m.id + 1);
  if (!n) { showTab('trophy'); return; }
  if (!unlocked(n.id)) { showTab('home'); return; }
  openMission(n.id);
}

/* ---------- kuis ---------- */
function startQuiz(m) {
  S.m = m; S.qi = 0; S.qMist = 0; S.qRes = [];
  showScreen('s-quiz'); $('#qTitle').textContent = m.title; $('#qConcept').textContent = RANKS[m.rank].name + ' • ' + m.concept; $('#qStory').textContent = m.story;
  showQ();
}
function showQ() {
  const m = S.m, q = m.questions[S.qi];
  $('#qDots').innerHTML = m.questions.map((_, i) => '<i class="' + (S.qRes[i] || '') + (i === S.qi ? ' cur' : '') + '"></i>').join('');
  $('#qCode').textContent = q.code;
  $('#qOpts').innerHTML = q.options.map((o, i) => '<button data-o="' + i + '">' + esc(o) + '</button>').join('');
  $('#qFb').hidden = true; $('#qNext').hidden = true;
}
$('#qOpts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const m = S.m, q = m.questions[S.qi], pick = q.options[+b.dataset.o], ok = pick === q.answer;
  $$('#qOpts button').forEach(x => { x.disabled = true; if (q.options[+x.dataset.o] === q.answer) x.classList.add('ok'); });
  if (!ok) { b.classList.add('no'); S.qMist++; sfx.lose(); } else sfx.win();
  S.qRes[S.qi] = ok ? 'ok' : 'no';
  $('#qFb').hidden = false; $('#qFb').innerHTML = ok ? '<b style="color:var(--green)">Benar! 🎯</b>' : '<b style="color:#ff8a9a">Belum tepat.</b> Jawabannya: <b>' + esc(q.answer) + '</b>. Coba ikuti kode baris demi baris.';
  $('#qNext').hidden = false; $('#qNext').textContent = S.qi < m.questions.length - 1 ? 'Soal berikutnya ›' : 'Lihat hasil';
  $('#qDots').innerHTML = m.questions.map((_, i) => '<i class="' + (S.qRes[i] || '') + (i === S.qi ? ' cur' : '') + '"></i>').join('');
});
$('#qNext').onclick = () => {
  const m = S.m;
  if (S.qi < m.questions.length - 1) { S.qi++; showQ(); return; }
  const stars = S.qMist === 0 ? 3 : S.qMist <= 1 ? 2 : 1;
  if (stars > (P.stars[m.id] || 0)) P.stars[m.id] = stars;
  const added = checkAchievements(m, stars); save();
  openSheet('<h2>' + (S.qMist === 0 ? '🎯 Sempurna!' : 'Kuis selesai!') + '</h2><div class="bigstars">' + starStr(stars) + '</div><p>Benar ' + (m.questions.length - S.qMist) + ' dari ' + m.questions.length + '.</p><p class="sub"><b>Yang kamu pelajari:</b> ' + esc(m.learn) + '</p><canvas class="res-card" id="rc"></canvas><div class="row2"><button class="primary" id="rShare">📲 Bagikan ke WhatsApp</button></div>' + extraAch(added) + '<div class="row2"><button class="ghost" id="rAgain">Ulangi kuis</button><button class="ghost" id="rNext">Lanjut ›</button></div>');
  const spec = specFor('m' + m.id); cardCanvas(spec, $('#rc')); SHARE.toBlob(spec).then(() => cardCanvas(spec, $('#rc'))).catch(() => {});
  $('#rShare').onclick = () => shareSpec(spec); wireExtra(added);
  $('#rAgain').onclick = () => { closeSheet(); startQuiz(m); };
  $('#rNext').onclick = () => { closeSheet(); nextMission(); };
};
$('#qBack').onclick = () => showTab('home');

/* ---------- mulai ---------- */
/* ---------- halaman awal & Robo Labirin ---------- */
function roboStars() { try { const s = JSON.parse(localStorage.getItem('robo-labirin-v1')); return s && s.stars ? Object.values(s.stars).reduce((a, b) => a + b, 0) : 0; } catch (e) { return 0; } }
function renderHub() {
  const rs = roboStars();
  $('#hubRobo').textContent = '★ ' + rs + '/60 bintang';
  $('#hubArena').textContent = '★ ' + totalStars() + '/' + TOTAL_STARS + ' bintang';
}
function openHub() { showScreen('s-hub'); renderHub(); }
function openArena() { showTab('home'); if (!P.name) askName(); }
function openRobo() { showScreen('s-robo'); const f = $('#roboFrame'); if (!f.getAttribute('srcdoc')) f.srcdoc = ROBO_SRC; }
$('#goArena').onclick = openArena;
$('#goRobo').onclick = openRobo;
$('#roboBack').onclick = openHub;
$('#btnHub').onclick = openHub;
window.__arena = { P: () => P, openMission, showTab, S, specFor, renderTrophy, openHub, openArena, openRobo };
let deferredInstall = null;
const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!standalone) $('#btnInstall').hidden = false; });
window.addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; deferredInstall = null; toast('Aplikasi terpasang 🎉'); });
$('#btnInstall').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { /* abaikan */ } deferredInstall = null; $('#btnInstall').hidden = true; };
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#iosHint').hidden = false;
const startGame = new URLSearchParams(location.search).get('g');
if (startGame === 'robo') openRobo(); else if (startGame === 'arena') openArena(); else openHub();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
