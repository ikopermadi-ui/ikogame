<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YorisGame</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="YorisGame">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:"Lexend";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Lexend";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/lexend-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Russo One";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/russo-one-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Baloo 2";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format("woff2")}
:root{--bg:#0a0f24;--panel:#121a3a;--panel2:#1a2550;--line:rgba(255,255,255,.1);--ink:#eaf0ff;--mut:#9aa8d4;--gold:#ffc83d;--blue:#3d8bff;--red:#ff3b5c;--green:#44e08a;--accent:#ffc83d;--r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.45 Lexend,system-ui,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.tabscr{padding-bottom:calc(62px + var(--safe-b))}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:12px}
.hi{font:400 22px/1.15 "Russo One",system-ui,sans-serif;letter-spacing:.2px}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
.starsum{font:400 18px "Russo One",sans-serif;color:var(--gold);background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;white-space:nowrap}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#0d1330;border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
#nav[hidden]{display:none}
#nav button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:var(--mut)}
#nav button i{font-style:normal;font-size:20px}
#nav button.on{color:var(--gold)}
/* peta misi */
.rank{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--rc);border-radius:var(--r);padding:12px 12px 14px;margin:0 0 12px}
.rank.lock{opacity:.55}
.rank h3{margin:0;font:400 18px "Russo One",sans-serif;color:var(--rc);display:flex;align-items:center;gap:8px}
.rank .tag{font:600 10px Lexend;letter-spacing:.8px;background:rgba(255,255,255,.1);color:var(--ink);padding:2px 7px;border-radius:99px}
.rank p{margin:2px 0 10px;color:var(--mut);font-size:13px}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.node{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;position:relative}
.node:active{transform:scale(.98)}
.node.locked{opacity:.45}
.node .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:400 15px "Russo One",system-ui,sans-serif;background:var(--rc);color:#0a0f24}
.node.done .n{box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.node b{display:block;font-size:13px;line-height:1.2;font-weight:600}
.node .st{font-size:13px;color:var(--gold);letter-spacing:1px;margin-top:2px}
.node .st s{text-decoration:none;color:rgba(255,255,255,.2)}
/* bar atas ruang main */
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:52px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--panel);border:1px solid var(--line);flex:none}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.ttl b{font:400 17px/1.15 "Russo One",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena{position:relative;margin:0;background:#0d1530;border-block:1px solid var(--line)}
#cv{display:block;width:100%;aspect-ratio:360/200;height:auto}
.hud{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.hud span{background:rgba(6,9,26,.72);padding:2px 8px;border-radius:99px;font:600 12px Lexend;border:1px solid rgba(255,255,255,.12)}
.pb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0d1330;border-bottom:1px solid var(--line)}
.pbb{width:44px;height:40px;border-radius:10px;background:var(--panel2);font-size:18px}
.pbb.spd{font:400 15px "Russo One",system-ui,sans-serif}
#pbRange{flex:1;min-width:0;height:40px;accent-color:var(--gold)}
.tabs{display:flex;padding:6px 10px 0;gap:6px}
.tabs button{flex:1;min-height:40px;border-radius:10px 10px 0 0;color:var(--mut);background:var(--panel);font-weight:600;font-size:14px}
.tabs button.on{background:var(--panel2);color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
.panes{flex:1;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.pane{flex:1;overflow-y:auto;padding:10px 12px 90px;-webkit-overflow-scrolling:touch}
.runbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 10px calc(8px + var(--safe-b));background:linear-gradient(180deg,rgba(10,15,36,0),#0a0f24 30%);z-index:4}
.primary{flex:1;min-height:50px;border-radius:14px;background:linear-gradient(180deg,#ffd75a,#f0a500);color:#1a1200;font:400 17px "Russo One",sans-serif;box-shadow:0 4px 0 #9a6a00}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6a00}
.primary.wide{width:100%;margin-top:14px}
.ghost{min-height:50px;min-width:50px;padding:0 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:14px}
/* info */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h4{margin:0 0 4px;font:600 12px Lexend;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.card p{margin:0}
.goal{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.goal i{font-style:normal;flex:none;width:22px}
.goal.ok{color:var(--green)}
.logl{font:13px/1.5 "JetBrains Mono",monospace;padding:3px 0;border-bottom:1px dashed var(--line)}
.logl.good{color:var(--green)}.logl.bad{color:#ff8a9a}.logl.say{color:var(--gold)}
/* blok */
.root{border:2px dashed rgba(255,255,255,.2);border-radius:14px;padding:8px}
.root>.hd,.blk>.hd{font:400 13px "Russo One",system-ui,sans-serif;letter-spacing:.4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px}
.blk{border-radius:12px;margin:6px 0;padding:6px 8px;position:relative;border:2px solid transparent}
.blk.sel{border-color:#fff}
.blk.act{background:#2c6df0;font-weight:600;display:flex;align-items:center;gap:8px;min-height:44px}
.blk.act.skill{background:#8a4cf0}.blk.act.heal{background:#17a864}.blk.act.retreat{background:#d0553d}.blk.act.wait{background:#58648c}.blk.act.buy{background:#c68a00}
.blk.rep{background:#1c8f86}.blk.if{background:#b25a1a}.blk.elif{background:#a14b6e}.blk.else{background:#7a4a9e}
.blk .in{background:rgba(0,0,0,.22);border-radius:10px;padding:2px 6px 6px;margin:2px 0 4px;min-height:30px}
.add{width:100%;min-height:44px;border:2px dashed rgba(255,255,255,.35);border-radius:10px;color:#fff;font-weight:600;margin-top:4px;background:rgba(255,255,255,.06)}
.chipb{background:rgba(0,0,0,.35);border-radius:10px;min-height:36px;padding:0 10px;font:600 14px Lexend;border:1px solid rgba(255,255,255,.3)}
.step{display:inline-flex;align-items:center;background:rgba(0,0,0,.35);border-radius:10px}
.step button{width:40px;height:38px;font-size:20px;font-weight:700}
.step b{min-width:26px;text-align:center;font:400 16px "Russo One",system-ui,sans-serif}
.tool{display:flex;gap:6px;margin-top:6px}
.tool button{flex:1;min-height:40px;border-radius:10px;background:rgba(0,0,0,.35);font-size:15px}
details.gen{margin-top:10px;background:var(--panel);border-radius:12px;padding:8px 10px}
details.gen summary{min-height:32px;font-weight:600;color:var(--mut)}
pre.gencode{margin:6px 0 0;font:13px/1.55 "JetBrains Mono",monospace;color:#d9e6ff;white-space:pre;overflow-x:auto}
/* editor kode */
.ed{display:flex;background:#080c20;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:220px;max-height:60vh}
.gut{flex:none;width:36px;overflow:hidden;text-align:right;padding:10px 6px 10px 0;font:16px/24px "JetBrains Mono",monospace;color:rgba(255,255,255,.28);background:#0b1130;user-select:none}
.gut div.bad{background:#ff3b5c;color:#fff;border-radius:0 6px 6px 0}
textarea#ta{flex:1;min-width:0;background:transparent;color:#e3ecff;border:0;outline:0;resize:none;padding:10px 10px;font:16px/24px "JetBrains Mono",monospace;white-space:pre;overflow:auto;tab-size:2;caret-color:var(--gold)}
.err{margin-top:10px;background:#3a1020;border:1px solid var(--red);color:#ffd3da;border-radius:12px;padding:10px 12px;font-size:14px}
.err b{color:#fff}
.chips{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#10173a;border-top:1px solid var(--line);padding:4px 6px;max-width:520px;margin:0 auto}
.chips .row{display:flex;gap:6px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
.chips .row::-webkit-scrollbar{display:none}
.chips button{flex:none;min-width:44px;min-height:40px;padding:0 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font:600 15px "JetBrains Mono",monospace}
.chips button.kw{color:#ffb4e8}.chips button.ac{color:#8fd0ff}
/* sheet */
#veil{position:fixed;inset:0;background:rgba(3,5,16,.7);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;background:#121a3a;border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px 16px calc(20px + var(--safe-b));z-index:50;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:4px auto 10px}
.sheet h2{margin:2px 0 4px;font:400 22px "Russo One",sans-serif}
.sheet .row2{display:flex;gap:8px;margin-top:12px}
.sheet .row2 .primary,.sheet .row2 .ghost{flex:1}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pal button{min-height:52px;border-radius:12px;font-weight:600;color:#fff;padding:6px}
.res-card{width:100%;border-radius:14px;display:block;margin:8px 0;border:1px solid var(--line);aspect-ratio:1080/1350;background:#0c1230}
.bigstars{font-size:38px;text-align:center;letter-spacing:6px;color:var(--gold);margin:4px 0}
.bigstars s{text-decoration:none;color:rgba(255,255,255,.18)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid canvas{width:100%;aspect-ratio:1080/1350;border-radius:12px;border:1px solid var(--line);background:#0c1230}
.grid button{padding:0;border-radius:12px;display:block}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:4px;color:var(--mut);font-size:13px}
input[type=text],select{width:100%;min-height:46px;border-radius:12px;background:#080c20;color:var(--ink);border:1px solid var(--line);padding:0 12px;font:16px Lexend}
select{padding:0 8px;min-height:44px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;min-height:52px;width:100%;text-align:left}
.sw small{display:block;color:var(--mut)}
.sw .tg{flex:none;width:46px;height:26px;border-radius:99px;background:#33406b;position:relative}
.sw .tg::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on .tg{background:var(--green)}.sw.on .tg::after{left:23px}
.dict h3{margin:14px 0 4px;font:400 15px "Russo One",system-ui,sans-serif;color:var(--gold)}
.dict dl{margin:0}.dict dt{font:600 14px "JetBrains Mono",monospace;color:#8fd0ff;margin-top:6px}.dict dd{margin:0 0 0 0;color:var(--ink);font-size:14px}
/* kuis */
.qbody{padding-top:8px}
.qstory{color:var(--mut);margin:4px 0 12px}
.qlabel{font:600 12px Lexend;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
.qcode{background:#080c20;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;font:15px/1.6 "JetBrains Mono",monospace;overflow-x:auto;color:#e3ecff}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qopts button{min-height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--line);font:400 18px "Russo One",system-ui,sans-serif;padding:8px}
.qopts button.ok{background:#12603a;border-color:var(--green)}
.qopts button.no{background:#5a1526;border-color:var(--red)}
.qopts button:disabled{opacity:1}
.qfb{margin-top:12px;background:var(--panel);border-radius:12px;padding:10px 12px}
.dots{display:flex;gap:4px;width:auto;padding:0 8px;background:none;border:0}
.dots i{width:10px;height:10px;border-radius:50%;background:#33406b}.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}.dots i.cur{outline:2px solid var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#fff;color:#10163a;font-weight:600;padding:10px 16px;border-radius:99px;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (max-height:620px){.pane{padding-bottom:80px}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* halaman awal */
.hub{padding-top:18px}
.hi.big{font-size:28px}
.gcard{display:grid;gap:6px;width:100%;text-align:left;padding:14px;border-radius:20px;margin:0 0 14px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.gcard:active{transform:scale(.985)}
.gcard.robo{background:linear-gradient(160deg,#14346f,#0f2250 70%)}
.gcard.arena{background:linear-gradient(160deg,#5a1230,#241136 70%)}
.gcard .art{width:100%;aspect-ratio:120/52;border-radius:12px;display:block;margin-bottom:6px}
.gcard .gt{font:400 24px/1.1 "Russo One",system-ui,sans-serif}
.gcard .gd{color:#c8d3f5;font-size:14px}
.gcard .gp{display:inline-block;justify-self:start;margin-top:4px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font:600 13px Lexend,sans-serif;color:var(--gold)}
.hubnote{text-align:center;margin-top:4px}
#roboFrame{flex:1;min-height:0;width:100%;border:0;background:#EAF1FA;border-top:1px solid var(--line)}
@media (min-width:480px){.hub{padding-inline:20px}}
.wide-btn{width:100%;margin:0 0 12px}

.hubtop{position:relative;display:flex;align-items:flex-end;min-height:178px;margin:0 0 16px;padding:18px 0 0 16px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 78% 30%,#2b4fb8 0,#14275e 45%,#0c1230 100%);border:1px solid var(--line)}
.hubtext{position:relative;z-index:1;align-self:center;padding-bottom:16px;max-width:55%}
.brand{font:400 34px/1 "Russo One",system-ui,sans-serif;letter-spacing:.3px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.brand span{color:var(--gold)}
.hubtext .sub{margin-top:8px;color:#c8d3f5;font-size:14px}
.hubhero{position:absolute;right:-6px;bottom:0;height:112%;width:auto;max-width:62%;object-fit:contain;object-position:right bottom;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.av{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#1a2550;border:2px solid var(--gold);flex:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.whot{min-width:0}
.whot .hi{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starsum{font-size:15px!important;padding:6px 10px!important}
.winrow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:2px}
.winrow img{height:96px;width:auto;margin-top:-34px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
#s-robo .bar .av{width:40px;height:40px}

</style>
</head>
<body>
<div id="app">
  <section id="s-hub" class="screen">
    <div class="scroll hub">
      <div class="hubtop">
        <div class="hubtext"><div class="brand">Yoris<span>Game</span></div><div class="sub" id="hubHello">Halo, Yoris! Pilih permainanmu.</div></div>
        <img class="hubhero" id="hubHero" alt="Yoris mengacungkan dua jempol" width="560" height="579">
      </div>
      <button class="gcard robo" id="goRobo" type="button">
        <svg viewBox="0 14 120 52" preserveAspectRatio="xMidYMid slice" class="art" aria-hidden="true"><g fill="none"><rect x="6" y="6" width="108" height="68" rx="10" fill="#dfeaff"/><path d="M20 20H60V50H100" stroke="#2457E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 9"/><rect x="14" y="14" width="14" height="14" rx="4" fill="#1AA6B7"/><circle cx="19" cy="21" r="2" fill="#0D2C37"/><circle cx="24" cy="21" r="2" fill="#0D2C37"/><path d="M60 52l12-8v16z" fill="#EF4458" transform="translate(30 -4)"/><path d="M84 36l9 7-9 7z" fill="#FFC21A"/><rect x="54" y="50" width="10" height="10" fill="#8392AE" rx="3"/></g></svg>
        <span class="gt">Robo Labirin</span>
        <span class="gd">Susun blok perintah, antar robot ke bendera. 20 level, dari mudah sampai labirin raksasa.</span>
        <span class="gp" id="hubRobo"></span>
      </button>
      <button class="gcard arena" id="goArena" type="button">
        <svg viewBox="0 14 120 52" preserveAspectRatio="xMidYMid slice" class="art" aria-hidden="true"><g fill="none"><rect x="6" y="6" width="108" height="68" rx="10" fill="#10163a"/><path d="M20 58h80" stroke="#2c4a3c" stroke-width="6" stroke-linecap="round"/><path d="M26 56V30l8-6 8 6v26z" fill="#3d8bff"/><path d="M78 56V30l8-6 8 6v26z" fill="#ff3b5c"/><path d="M52 52 68 28M66 28h4v4" stroke="#ffc83d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
        <span class="gt">Arena Kode</span>
        <span class="gd">Game ala MOBA: tulis kode untuk hero, menangkan pertarungan. 24 misi sampai level ahli.</span>
        <span class="gp" id="hubArena"></span>
      </button>
      <button class="ghost wide-btn" id="btnInstall" type="button" hidden>📲 Pasang sebagai aplikasi</button>
      <p class="sub hubnote" id="iosHint" hidden>Di iPhone: ketuk tombol Bagikan, lalu pilih <b>Tambah ke Layar Utama</b>.</p>
      <p class="sub hubnote">Kemajuan dan bintang tiap game tersimpan di HP ini.</p>

    else if (s === '(') insertAt('()', 1); else if (s === '"') insertAt('""', 1); else if (s === '[') insertAt('[]', 1);

  } else if (d.kw !== undefined) { const k = KW[+d.kw]; insertAt(k[1], k[2]); }
  else if (d.ac !== undefined) { const k = ACTS[+d.ac]; insertAt(k[1], k[2]); }
});
function placeChips() {
  const vv = window.visualViewport, c = $('#chips'); if (!vv) return;
  const kb = window.innerHeight - vv.height - vv.offsetTop;
  c.hidden = !(document.activeElement === ta && window.innerHeight - vv.height > 100);
  c.style.bottom = Math.max(0, kb) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', placeChips); visualViewport.addEventListener('scroll', placeChips); }
ta.addEventListener('focus', () => { placeChips(); setTimeout(placeChips, 300); });
ta.addEventListener('blur', () => { setTimeout(placeChips, 120); });
function showErr(msg, line) {
  const e = $('#errbox'); e.hidden = false; e.innerHTML = '<b>' + (line ? 'Baris ' + line + ': ' : 'Oops: ') + '</b>' + esc(msg);
  if (line && S.m.kind === 'code') syncGut(line);
}
function hideErr() { $('#errbox').hidden = true; if (S.m && S.m.kind === 'code') syncGut(); }

/* ---------- kamus ---------- */
const DICT = [
  ['Aksi (perintah hero)', [['attack()', 'Serang musuh terdekat dalam jangkauan (4).'], ['skill()', 'Jurus kuat, butuh mana 20. Jangkauan 8, jeda 4 detik.'], ['heal()', 'Sembuhkan 40 nyawa, butuh mana 20. Jeda 6 detik.'], ['move()', 'Maju 3 langkah ke arah musuh.'], ['retreat()', 'Mundur ke markas sendiri.'], ['wait()', 'Diam satu detik.'], ['buy("sword")', 'Beli item: "sword" (+5 serangan, 60 emas), "armor" (kurangi damage, 50 emas), "potion" (isi 40 nyawa, 30 emas).']]],
  ['Sensor (mata hero)', [['hp', 'Nyawa hero sekarang.'], ['mana', 'Mana hero.'], ['gold', 'Emas yang dimiliki.'], ['x', 'Posisimu di jalur (0 = markas sendiri).'], ['time', 'Detik sejak mulai.'], ['skill_ready', 'True kalau jurus bisa dipakai.'], ['heal_ready', 'True kalau heal bisa dipakai.'], ['hero_dist', 'Jarak ke hero musuh.'], ['minion_dist', 'Jarak ke minion/boneka terdekat.'], ['tower_dist', 'Jarak ke tower musuh.'], ['danger', 'True kalau kamu di jangkauan tower musuh.'], ['attack_range', 'Jangkauan serangan hero.']]],
  ['Bahasa kode', [['if syarat:', 'Kerjakan isinya hanya jika syarat benar.'], ['elif / else', 'Pilihan lain jika syarat sebelumnya salah.'], ['while syarat:', 'Ulangi selama syarat benar. while True: = selamanya.'], ['for i in range(5):', 'Ulangi 5 kali.'], ['x = 3', 'Simpan nilai di variabel.'], ['def nama(a):', 'Buat fungsi baru. Gunakan return untuk mengirim jawaban.'], ['[1, 2, 3]', 'List: kumpulan nilai. a[0] = item pertama. a.append(4) menambah.'], ['and  or  not', 'dan, atau, bukan.'], ['global x', 'Izinkan fungsi mengubah variabel di luar.'], ['# komentar', 'Catatan untuk manusia, diabaikan komputer.']]]
];
function openDict() {
  openSheet('<h2>📖 Kamus</h2><div class="dict">' + DICT.map(([t, rows]) => '<h3>' + esc(t) + '</h3><dl>' + rows.map(([a, b]) => '<dt>' + esc(a) + '</dt><dd>' + esc(b) + '</dd>').join('') + '</dl>').join('') + '</div>');
}
$('#btnDict').addEventListener('click', openDict);

/* ---------- arena & replay ---------- */
const cv = $('#cv'), cx = cv.getContext('2d');
function fitCanvas() { const d = Math.min(window.devicePixelRatio || 1, 3), w = cv.clientWidth || 360; cv.width = Math.round(w * d); cv.height = Math.round(w * d * REND.H / REND.W); cx.setTransform(cv.width / REND.W, 0, 0, cv.width / REND.W, 0, 0); }
window.addEventListener('resize', () => { if (!$('#s-play').hidden) { fitCanvas(); renderFrame(); } });
const frames = () => (S.sim && S.sim.frames.length ? S.sim.frames : [S.startFrame]);
function renderFrame() {
  const fr = frames(), n = fr.length, i = Math.min(Math.floor(S.T), n - 1), p = n > 1 && i < n - 1 ? S.T - i : 0;
  const f0 = fr[i], f1 = fr[Math.min(i + 1, n - 1)];
  if (S.fxI !== i) { S.fxI = i; S.fx = i < n - 1 ? REND.fxFor(f1, f0) : []; if (S.playing && S.fx.length) for (const e of S.fx) { if (e.k === 'num' && e.kind === 'skill') sfx.skill(); else if (e.k === 'num' && e.col === '#58e69b') sfx.heal(); else if (e.k === 'num' && e.v[0] === '-') { sfx.hit(); break; } } updateHud(f0, i); }
  REND.draw(cx, f0, f1, p, performance.now() / 1000, S.fx, p);
}
function updateHud(f, i) {
  const u = f.u.find(x => x.pl); const lim = S.m.scenario.limit;
  $('#hud').innerHTML = u ? '<span>❤ ' + u.hp + '/' + u.max + '</span><span>💧 ' + u.mana + '</span><span>💰 ' + u.gold + '</span><span>⏱ ' + f.t + '/' + lim + '</span>' : '<span>⏱ ' + f.t + '</span>';
}
function loop(ts) {
  S.raf = requestAnimationFrame(loop);
  if ($('#s-play').hidden) return;
  const dt = Math.min(0.1, (ts - S.last) / 1000); S.last = ts;
  if (S.playing && S.sim) {
    S.T += dt * 2 * S.speed;
    const end = S.sim.frames.length - 1;
    if (S.T >= end) { S.T = end; S.playing = false; $('#pbPlay').textContent = '▶'; onPlayEnd(); }
    $('#pbRange').value = S.T;
  }
  renderFrame();
}
$('#pbPlay').onclick = () => { if (!S.sim) return; if (S.T >= S.sim.frames.length - 1) { S.T = 0; S.fxI = -1; S.ended = false; } S.playing = !S.playing; $('#pbPlay').textContent = S.playing ? '⏸' : '▶'; };
$('#pbRange').oninput = e => { S.playing = false; $('#pbPlay').textContent = '▶'; S.T = +e.target.value; S.fxI = -1; };
$('#pbSpd').onclick = () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $('#pbSpd').textContent = S.speed + '×'; };

/* ---------- membuka misi ---------- */
function setPane(p) {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  ['code', 'info', 'log'].forEach(k => { $('#p-' + k).hidden = k !== p; });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPane(b.dataset.p); });
function openMission(id) {
  const m = MBY(id); S.m = m;
  if (m.kind === 'quiz') { startQuiz(m); return; }
  S.sim = null; S.T = 0; S.playing = false; S.hintN = 0; S.fxI = -1; S.ended = true; S.sel = null;
  showScreen('s-play');
  $('#plTitle').textContent = m.title; $('#plConcept').textContent = RANKS[m.rank].name + ' • ' + m.concept;
  $('#pb').hidden = true; hideErr();
  const blocks = m.kind === 'blocks';
  $('#blkWrap').hidden = !blocks; $('#codeWrap').hidden = blocks; $('#chips').hidden = true;
  if (blocks) { S.tree = P.blocks[m.id] ? JSON.parse(JSON.stringify(P.blocks[m.id])) : JSON.parse(JSON.stringify(m.starter)); renderBlocks(); }
  else { ta.value = P.code[m.id] !== undefined ? P.code[m.id] : m.starter; syncGut(); }
  const pre = SIM.simulate(m.scenario, 'pass');
  S.startFrame = pre.frames[0];
  fitCanvas(); updateHud(S.startFrame, 0); renderInfo(); renderLog([]);
  setPane('code'); $('#btnRun').textContent = '▶ JALANKAN';
  cancelAnimationFrame(S.raf); S.last = performance.now(); S.raf = requestAnimationFrame(loop);
}
function renderInfo(win) {
  const m = S.m, par = m.par;
  const hints = m.hints.slice(0, S.hintN).map((h, i) => '<div class="goal"><i>💡</i><span>' + esc(h) + '</span></div>').join('');
  $('#p-info').innerHTML = '<div class="card"><h4>Cerita</h4><p>' + esc(m.story) + '</p></div>' +
    '<div class="card"><h4>Tujuan</h4><div class="goal"><i>🎯</i><span>' + esc(m.goal) + '</span></div><div class="goal"><i>⏱</i><span>Bintang 2: menang dalam ≤ ' + par.ticks + ' detik</span></div><div class="goal"><i>✂</i><span>Bintang 3: kode ≤ ' + par.lines + ' baris</span></div></div>' +
    (hints ? '<div class="card"><h4>Petunjuk</h4>' + hints + '</div>' : '') +
    (win || cleared(m.id) ? '<div class="card"><h4>Yang kamu pelajari</h4><p>' + esc(m.learn) + '</p></div>' : '');
}
function renderLog(lines, extra) {
  $('#p-log').innerHTML = (extra ? '<div class="logl bad">' + esc(extra) + '</div>' : '') + (lines.length ? lines.map(l => '<div class="logl ' + (l.kind || '') + '">[' + l.tick + 'd] ' + esc(l.text) + '</div>').join('') : (extra ? '' : '<div class="empty">Catatan pertarungan muncul di sini setelah kamu menjalankan kode.</div>'));
}
$('#btnBack').onclick = () => { S.playing = false; if (document.activeElement) document.activeElement.blur(); $('#chips').hidden = true; showTab('home'); };
$('#btnHint').onclick = () => { if (S.hintN < S.m.hints.length) S.hintN++; renderInfo(); setPane('info'); if (S.hintN >= S.m.hints.length) toast('Itu petunjuk terakhir. Semangat!'); };
$('#btnReset').onclick = () => {
  const m = S.m, ok = true;
  if (m.kind === 'blocks') { S.tree = JSON.parse(JSON.stringify(m.starter)); renderBlocks(); } else { ta.value = m.starter; syncGut(); P.code[m.id] = m.starter; save(); }
  hideErr(); S.sim = null; S.T = 0; S.playing = false; S.fxI = -1; $('#pb').hidden = true; updateHud(S.startFrame, 0); toast('Kode dikembalikan ke awal');
};

/* ---------- menjalankan ---------- */
$('#btnRun').onclick = () => {
  if (document.activeElement) document.activeElement.blur();
  const m = S.m; let src;
  if (m.kind === 'blocks') { if (!S.tree.length) { toast('Tambahkan blok dulu (ketuk ＋)'); return; } src = BLK.blocksToCode(S.tree); }
  else { src = ta.value; P.code[m.id] = src; save(); }
  let res;
  try { res = SIM.simulate(m.scenario, src); } catch (e) { toast('Ada masalah teknis: ' + e.message); return; }
  S.src = src; S.res = res; hideErr();
  if (!res.frames.length) { showErr(res.outcome.message, res.outcome.line); setPane('code'); sfx.lose(); return; }
  S.sim = res; S.T = 0; S.fxI = -1; S.playing = true; S.ended = false; S.speed = 1; $('#pbSpd').textContent = '1×';
  $('#pb').hidden = false; $('#pbRange').max = res.frames.length - 1; $('#pbRange').value = 0; $('#pbPlay').textContent = '⏸';
  renderLog(res.log, res.outcome.status === 'error' ? (res.outcome.line ? 'Baris ' + res.outcome.line + ': ' : '') + res.outcome.message : '');
  $('#btnRun').textContent = '▶ JALANKAN LAGI';
  window.scrollTo(0, 0);
};
const REASON = { dead: 'Heromu gugur.', nexus: 'Markasmu hancur.', time: 'Waktu habis sebelum tujuan tercapai.' };
function onPlayEnd() {
  if (S.ended) return; S.ended = true;
  const m = S.m, res = S.res, o = res.outcome, won = o.status === 'win';
  const lines = BLK.codeLines(S.src), ticks = res.stats.ticks;
  const goals = [won, won && ticks <= m.par.ticks, won && lines <= m.par.lines];
  const stars = goals.filter(Boolean).length;
  let h;
  if (won) {
    sfx.win();
    const had = P.stars[m.id] || 0;
    if (stars > had) P.stars[m.id] = stars;
    if (m.kind === 'blocks') P.blocks[m.id] = S.tree; else P.code[m.id] = S.src;
    const added = checkAchievements(m, stars); save();
    S.lastWin = true; renderInfo(true);
    h = winHead('🎉 Misi selesai!') + '<div class="bigstars">' + starStr(stars) + '</div>' + goalsHtml(goals, m, ticks, lines) + '<p class="sub" style="margin:8px 0"><b>Yang kamu pelajari:</b> ' + esc(m.learn) + '</p>' +
      '<canvas class="res-card" id="rc"></canvas><div class="row2"><button class="primary" id="rShare">📲 Bagikan ke WhatsApp</button></div>' + extraAch(added) +
      '<div class="row2"><button class="ghost" id="rAgain">' + (stars < 3 ? 'Coba bintang lebih' : 'Main lagi') + '</button><button class="ghost" id="rNext">Lanjut ›</button></div>';
    openSheet(h);
    const spec = specFor('m' + m.id); cardCanvas(spec, $('#rc'));
    SHARE.toBlob(spec).then(() => cardCanvas(spec, $('#rc'))).catch(() => {});
    $('#rShare').onclick = () => shareSpec(spec);
    wireExtra(added);
    $('#rAgain').onclick = closeSheet;
    $('#rNext').onclick = () => { closeSheet(); nextMission(); };
  } else {
    sfx.lose();
    const why = o.status === 'error' ? ((o.line ? 'Baris ' + o.line + ': ' : '') + o.message) : (REASON[o.reason] || 'Belum berhasil.');
    h = '<h2>Belum berhasil 😤</h2><p><b>' + esc(why) + '</b></p><p class="sub">Tonton ulang pertarungan (geser garis waktu), cari kapan heromu salah langkah, lalu ubah kodenya. Programmer hebat selalu mencoba lagi!</p><div class="row2"><button class="ghost" id="rHint">💡 Petunjuk</button><button class="primary" id="rAgain">Coba lagi</button></div>';
    openSheet(h);
    $('#rAgain').onclick = closeSheet;
    $('#rHint').onclick = () => { if (S.hintN < m.hints.length) S.hintN++; renderInfo(); closeSheet(); setPane('info'); };
  }
}
function winHead(t) { return '<div class="winrow"><h2>' + t + '</h2><img src="' + YORIS_HERO + '" alt="Yoris dua jempol"></div>'; }
function goalsHtml(goals, m, ticks, lines) {
  const L = ['Menang: ' + m.goal, 'Cepat: ' + ticks + ' dari ≤ ' + m.par.ticks + ' detik', 'Ringkas: ' + lines + ' dari ≤ ' + m.par.lines + ' baris'];
  return '<div class="card">' + L.map((t, i) => '<div class="goal' + (goals[i] ? ' ok' : '') + '"><i>' + (goals[i] ? '★' : '☆') + '</i><span>' + esc(t) + '</span></div>').join('') + '</div>';
}
function extraAch(added) {
  const ex = added.filter(k => k[0] !== 'm'); if (!ex.length) return '';
  return '<h2 style="margin-top:16px">✨ Pencapaian baru!</h2><div class="thumbs">' + ex.map(k => '<button data-x="' + k + '" style="padding:0"><canvas width="540" height="675" class="xc" style="width:100%;aspect-ratio:1080/1350;border-radius:10px;border:1px solid var(--line)"></canvas></button>').join('') + '</div>';
}
function wireExtra(added) {
  const ex = added.filter(k => k[0] !== 'm'); const cs = $$('#sheetBody .xc');
  ex.forEach((k, i) => { const s = specFor(k); if (s && cs[i]) cardCanvas(s, cs[i]); });
  $$('#sheetBody [data-x]').forEach(b => b.onclick = () => { const s = specFor(b.dataset.x); if (s) shareSpec(s); });
}
function nextMission() {
  const n = MBY(S.m.id + 1);
  if (!n) { showTab('trophy'); return; }
  if (!unlocked(n.id)) { showTab('home'); return; }
  openMission(n.id);
}

/* ---------- kuis ---------- */
function startQuiz(m) {
  S.m = m; S.qi = 0; S.qMist = 0; S.qRes = [];
  showScreen('s-quiz'); $('#qTitle').textContent = m.title; $('#qConcept').textContent = RANKS[m.rank].name + ' • ' + m.concept; $('#qStory').textContent = m.story;
  showQ();
}
function showQ() {
  const m = S.m, q = m.questions[S.qi];
  $('#qDots').innerHTML = m.questions.map((_, i) => '<i class="' + (S.qRes[i] || '') + (i === S.qi ? ' cur' : '') + '"></i>').join('');
  $('#qCode').textContent = q.code;
  $('#qOpts').innerHTML = q.options.map((o, i) => '<button data-o="' + i + '">' + esc(o) + '</button>').join('');
  $('#qFb').hidden = true; $('#qNext').hidden = true;
}
$('#qOpts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const m = S.m, q = m.questions[S.qi], pick = q.options[+b.dataset.o], ok = pick === q.answer;
  $$('#qOpts button').forEach(x => { x.disabled = true; if (q.options[+x.dataset.o] === q.answer) x.classList.add('ok'); });
  if (!ok) { b.classList.add('no'); S.qMist++; sfx.lose(); } else sfx.win();
  S.qRes[S.qi] = ok ? 'ok' : 'no';
  $('#qFb').hidden = false; $('#qFb').innerHTML = ok ? '<b style="color:var(--green)">Benar! 🎯</b>' : '<b style="color:#ff8a9a">Belum tepat.</b> Jawabannya: <b>' + esc(q.answer) + '</b>. Coba ikuti kode baris demi baris.';
  $('#qNext').hidden = false; $('#qNext').textContent = S.qi < m.questions.length - 1 ? 'Soal berikutnya ›' : 'Lihat hasil';
  $('#qDots').innerHTML = m.questions.map((_, i) => '<i class="' + (S.qRes[i] || '') + (i === S.qi ? ' cur' : '') + '"></i>').join('');
});
$('#qNext').onclick = () => {
  const m = S.m;
  if (S.qi < m.questions.length - 1) { S.qi++; showQ(); return; }
  const stars = S.qMist === 0 ? 3 : S.qMist <= 1 ? 2 : 1;
  if (stars > (P.stars[m.id] || 0)) P.stars[m.id] = stars;
  const added = checkAchievements(m, stars); save();
  openSheet(winHead(S.qMist === 0 ? '🎯 Sempurna!' : 'Kuis selesai!') + '<div class="bigstars">' + starStr(stars) + '</div><p>Benar ' + (m.questions.length - S.qMist) + ' dari ' + m.questions.length + '.</p><p class="sub"><b>Yang kamu pelajari:</b> ' + esc(m.learn) + '</p><canvas class="res-card" id="rc"></canvas><div class="row2"><button class="primary" id="rShare">📲 Bagikan ke WhatsApp</button></div>' + extraAch(added) + '<div class="row2"><button class="ghost" id="rAgain">Ulangi kuis</button><button class="ghost" id="rNext">Lanjut ›</button></div>');
  const spec = specFor('m' + m.id); cardCanvas(spec, $('#rc')); SHARE.toBlob(spec).then(() => cardCanvas(spec, $('#rc'))).catch(() => {});
  $('#rShare').onclick = () => shareSpec(spec); wireExtra(added);
  $('#rAgain').onclick = () => { closeSheet(); startQuiz(m); };
  $('#rNext').onclick = () => { closeSheet(); nextMission(); };
};
$('#qBack').onclick = () => showTab('home');

/* ---------- mulai ---------- */
/* ---------- halaman awal & Robo Labirin ---------- */
function roboStars() { try { const s = JSON.parse(localStorage.getItem('robo-labirin-v1')); return s && s.stars ? Object.values(s.stars).reduce((a, b) => a + b, 0) : 0; } catch (e) { return 0; } }
function renderHub() {
  $('#hubHero').src = YORIS_HERO; $('#avRobo').src = YORIS_AV;
  $('#hubHello').textContent = 'Halo, ' + (P.name || 'Yoris') + '! Pilih permainanmu.';
  const rs = roboStars();
  $('#hubRobo').textContent = '★ ' + rs + '/60 bintang';
  $('#hubArena').textContent = '★ ' + totalStars() + '/' + TOTAL_STARS + ' bintang';
}
function openHub() { showScreen('s-hub'); renderHub(); }
function openArena() { showTab('home'); if (!P.name) askName(); }
window.addEventListener('message', e => { const d = e.data; if (d && d.type === 'yg-share' && d.spec && e.source === ($('#roboFrame') || {}).contentWindow) shareSpec(d.spec); });
function openRobo() { showScreen('s-robo'); const f = $('#roboFrame'); if (!f.getAttribute('srcdoc')) f.srcdoc = ROBO_SRC; }
$('#goArena').onclick = openArena;
$('#goRobo').onclick = openRobo;
$('#roboBack').onclick = openHub;
$('#btnHub').onclick = openHub;
window.__arena = { P: () => P, openMission, showTab, S, specFor, renderTrophy, openHub, openArena, openRobo };
let deferredInstall = null;
const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!standalone) $('#btnInstall').hidden = false; });
window.addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; deferredInstall = null; toast('Aplikasi terpasang 🎉'); });
$('#btnInstall').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) { /* abaikan */ } deferredInstall = null; $('#btnInstall').hidden = true; };
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#iosHint').hidden = false;
const startGame = new URLSearchParams(location.search).get('g');
if (startGame === 'robo') openRobo(); else if (startGame === 'arena') openArena(); else openHub();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
